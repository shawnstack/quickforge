<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">QuickForge Cloud 管理后台桌面端低保真设计</title>
  <desc id="desc">左侧轻量导航，右侧顶部状态栏与仪表盘内容，包含核心指标、用量趋势、异常列表和审计日志。</desc>
  <defs>
    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #1f2937; }
      .h2 { font-size: 14px; font-weight: 600; fill: #374151; }
      .body { font-size: 13px; fill: #4b5563; }
      .muted { font-size: 12px; fill: #8a94a3; }
      .metric { font-size: 26px; font-weight: 600; fill: #111827; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #667085; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="236" height="900" fill="#f3f4f6"/>
  <line x1="235.5" y1="0" x2="235.5" y2="900" stroke="#e5e7eb"/>
  <g class="ui">
    <circle cx="28" cy="30" r="12" fill="#111827"/>
    <path d="M22 30h12M28 24v12" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
    <text x="48" y="34" class="h2">QuickForge Cloud</text>
    <text x="20" y="72" class="muted">运营管理</text>

    <rect x="12" y="84" width="212" height="36" rx="8" fill="#d9dee7"/>
    <text x="28" y="107" class="body" font-weight="600">概览</text>
    <text x="28" y="148" class="body">安装实例</text>
    <text x="28" y="188" class="body">额度管理</text>
    <text x="28" y="228" class="body">模型目录</text>
    <text x="28" y="268" class="body">审计日志</text>

    <line x1="20" y1="304" x2="216" y2="304" stroke="#dde1e7"/>
    <text x="20" y="336" class="muted">环境</text>
    <rect x="20" y="348" width="196" height="44" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="38" cy="370" r="4" fill="#22c55e"/>
    <text x="50" y="367" class="body">Production</text>
    <text x="50" y="382" class="muted">cloud.quickforge.io</text>

    <text x="20" y="850" class="muted">superadmin</text>
    <text x="20" y="870" class="mono">session expires in 43m</text>
  </g>

  <!-- Top bar -->
  <rect x="236" y="0" width="1204" height="60" fill="#ffffff"/>
  <line x1="236" y1="59.5" x2="1440" y2="59.5" stroke="#e5e7eb"/>
  <g class="ui">
    <text x="268" y="36" class="title">概览</text>
    <rect x="1118" y="17" width="92" height="28" rx="14" fill="#ecfdf3" stroke="#c6f0d5"/>
    <circle cx="1136" cy="31" r="4" fill="#22c55e"/>
    <text x="1147" y="35" class="muted" fill="#157347">服务正常</text>
    <rect x="1224" y="17" width="78" height="28" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="1244" y="35" class="body">刷新</text>
    <circle cx="1334" cy="31" r="14" fill="#eef0f3"/>
    <text x="1329" y="36" class="body" font-weight="600">A</text>
  </g>

  <!-- Content -->
  <g class="ui">
    <text x="268" y="104" class="body" font-weight="600">系统运行概况</text>
    <text x="268" y="124" class="muted">最后更新：刚刚 · 数据按 UTC+8 展示</text>

