<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>bot 吉祥物调色板</title>
<style>
    :root { --body: #0B0B0C; --eye: #FFFFFF; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2328; background: #f6f7f9;
    }
    h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .hint { margin: 0 0 24px; color: #6b7280; font-size: 13px; }
    .panel {
      display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;
      padding: 16px 18px; margin-bottom: 24px; background: #fff;
      border: 1px solid #e5e7eb; border-radius: 12px;
    }
    .panel > div { display: flex; flex-direction: column; gap: 8px; }
    .panel .label { font-size: 12px; color: #6b7280; }
    .row { display: flex; align-items: center; gap: 8px; }
    input[type="color"] {
      width: 38px; height: 30px; padding: 0; border: 1px solid #d8dce2;
      border-radius: 8px; background: none; cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; max-width: 340px; }
    .preset {
      display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 5px;
      font-size: 12px; color: #374151; background: #fff; border: 1px solid #e0e4ea;
      border-radius: 999px; cursor: pointer;
    }
    .preset:hover { border-color: #9aa4b2; }
    .preset i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); }
    .seg { display: flex; border: 1px solid #e0e4ea; border-radius: 8px; overflow: hidden; }
    .seg button {
      padding: 5px 10px; font-size: 12px; color: #4b5563; background: #fff;
      border: 0; border-right: 1px solid #e0e4ea; cursor: pointer;
    }
    .seg button:last-child { border-right: 0; }
    .seg button[aria-pressed="true"] { background: #eef1f5; color: #111827; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card {
      margin: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden;
    }
    .stage { display: grid; place-items: center; height: 200px; }
    .stage[data-bg="checker"] {
      background-color: #fff;
      background-image:
        linear-gradient(45deg, #eceef1 25%, transparent 25%, transparent 75%, #eceef1 75%),
        linear-gradient(45deg, #eceef1 25%, transparent 25%, transparent 75%, #eceef1 75%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }
    .stage[data-bg="light"] { background: #ffffff; }
    .stage[data-bg="dark"] { background: #14161a; }
    .bot { width: 168px; height: 168px; }
    .bot-body { transform-box: view-box; transform-origin: 0 0; }
    .eye { transform-box: fill-box; transform-origin: center; }
    figcaption { display: grid; gap: 2px; padding: 10px 12px 12px; border-top: 1px solid #f0f1f3; }
    figcaption strong { font-size: 13px; font-weight: 600; }
    figcaption code { font-size: 11px; color: #8b93a1; }
    figcaption span { font-size: 12px; color: #6b7280; }
    .cmd {
      margin-top: 24px; padding: 14px 16px; background: #101215; color: #e7e9ee;
      border-radius: 12px; font-size: 12.5px; overflow-x: auto; white-space: pre;
    }
    .cmd button {
      float: right; padding: 4px 10px; font-size: 12px; color: #d9dce3;
      background: #23262c; border: 1px solid #33373f; border-radius: 6px; cursor: pointer;
    }
.s-idle .bot-body{animation:body-idle 2.40s linear infinite}
.s-idle .eye-l{animation:eyeL-idle 2.40s linear infinite}

<body>
  <h1>bot 吉祥物调色板</h1>
  <p class="hint">
    这个页面只做预览：改颜色、看动作、拿导出命令。GIF 的真正编码在命令行完成，网页和 GIF 用的是同一套姿态数据。
    <br>切到「深色」背景可以看到纯黑球在深色界面里会只剩两只眼睛——选浅色身体或反色配色能避免。
  </p>

  <div class="panel">
    <div>
      <span class="label">身体</span>
      <div class="row">
        <input type="color" id="body-color" value="#0B0B0C" aria-label="身体颜色">
        <code id="body-hex">#0B0B0C</code>
      </div>
    </div>
    <div>
      <span class="label">眼睛</span>
      <div class="row">
        <input type="color" id="eye-color" value="#FFFFFF" aria-label="眼睛颜色">
        <code id="eye-hex">#FFFFFF</code>
      </div>
    </div>
    <div>
      <span class="label">预设配色</span>
      <div class="presets"><button class="preset" data-body="#0B0B0C" data-eye="#FFFFFF" title="ink"><i style="background:linear-gradient(135deg,#0B0B0C 50%,#FFFFFF 50%)"></i>ink</button><button class="preset" data-body="#FFFFFF" data-eye="#0B0B0C" title="inverse"><i style="background:linear-gradient(135deg,#FFFFFF 50%,#0B0B0C 50%)"></i>inverse</button><button class="preset" data-body="#2C3E70" data-eye="#FFFFFF" title="indigo"><i style="background:linear-gradient(135deg,#2C3E70 50%,#FFFFFF 50%)"></i>indigo</button><button class="preset" data-body="#EF8A3C" data-eye="#FFFFFF" title="tangerine"><i style="background:linear-gradient(135deg,#EF8A3C 50%,#FFFFFF 50%)"></i>tangerine</button><button class="preset" data-body="#57C2A6" data-eye="#FFFFFF" title="mint"><i style="background:linear-gradient(135deg,#57C2A6 50%,#FFFFFF 50%)"></i>mint</button><button class="preset" data-body="#6C4AB6" data-eye="#FFFFFF" title="grape"><i style="background:linear-gradient(135deg,#6C4AB6 50%,#FFFFFF 50%)"></i>grape</button><button class="preset" data-body="#F2C94C" data-eye="#242424" title="butter"><i style="background:linear-gradient(135deg,#F2C94C 50%,#242424 50%)"></i>butter</button><button class="preset" data-body="#4A5568" data-eye="#F7FAFC" title="slate"><i style="background:linear-gradient(135deg,#4A5568 50%,#F7FAFC 50%)"></i>slate</button></div>
    </div>
    <div>
      <span class="label">预览背景</span>
      <div class="seg">
        <button data-bg="checker" aria-pressed="true">棋盘格</button>
        <button data-bg="light" aria-pressed="false">白底</button>
        <button data-bg="dark" aria-pressed="false">深色</button>
      </div>
    </div>
  </div>

  <div class="grid"><figure class="card s-idle">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="待机">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-l" rx="20" ry="26" fill="var(--eye)"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-r" rx="20" ry="26" fill="var(--eye)"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>待机</strong>
          <code>idle</code>
          <span>2.4s · 慢呼吸 + 左右各瞟一眼 + 连眨两下</span>
        </figcaption>
      </figure><figure class="card s-thinking">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="思考">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-l" rx="20" ry="26" fill="var(--eye)"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-r" rx="20" ry="26" fill="var(--eye)"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>思考</strong>
          <code>thinking</code>
          <span>2.4s · 歪头往右上瞟，憋一下，想到时弹起来</span>
        </figcaption>
      </figure><figure class="card s-working">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="干活中">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-l" rx="20" ry="26" fill="var(--eye)"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-r" rx="20" ry="26" fill="var(--eye)"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>干活中</strong>
          <code>working</code>
          <span>1.0s · 两下弹跳，起跳拉长、落地压扁</span>
        </figcaption>
      </figure><figure class="card s-happy">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="开心">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><path class="eye eye-l" d="M -18 6 Q 0 -17 18 6" fill="none" stroke="var(--eye)" stroke-width="11" stroke-linecap="round"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><path class="eye eye-r" d="M -18 6 Q 0 -17 18 6" fill="none" stroke="var(--eye)" stroke-width="11" stroke-linecap="round"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>开心</strong>
          <code>happy</code>
          <span>1.2s · 蹲一下蓄力，两次大跳，弯月眼</span>
        </figcaption>
      </figure><figure class="card s-sleepy">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="犯困">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-l" rx="20" ry="26" fill="var(--eye)"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-r" rx="20" ry="26" fill="var(--eye)"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>犯困</strong>
          <code>sleepy</code>
          <span>3.6s · 越睡越沉，一激灵醒过来再睡回去</span>
        </figcaption>
      </figure><figure class="card s-alert">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="提醒">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-l" rx="20" ry="26" fill="var(--eye)"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-r" rx="20" ry="26" fill="var(--eye)"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>提醒</strong>
          <code>alert</code>
          <span>1.6s · 蹲下蓄力再窜起来，落地压扁后晃两下</span>
        </figcaption>
      </figure><figure class="card s-walk">
        <div class="stage" data-bg="checker">
          <svg class="bot" viewBox="0 0 512 512" role="img" aria-label="走路">
            <g class="bot-body">
              <circle cx="256" cy="258" r="150" fill="var(--body)"/>
              <g transform="translate(210.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-l" rx="20" ry="26" fill="var(--eye)"/></g><g transform="translate(302.00,267.00) rotate(0.000) scale(1.0000,1.0000)"><ellipse class="eye eye-r" rx="20" ry="26" fill="var(--eye)"/></g>
            </g>
          </svg>
        </div>
        <figcaption>
          <strong>走路</strong>
          <code>walk</code>
          <span>1.0s · 两步一停，落地压扁，边走边看着脚下</span>
        </figcaption>
      </figure></div>

  <div class="cmd">
    <button id="copy">复制命令</button>
    <span id="cmd-text"></span>
  </div>

<script>
    const bodyIn = document.getElementById('body-color');
    const eyeIn = document.getElementById('eye-color');
    const bodyHex = document.getElementById('body-hex');
    const eyeHex = document.getElementById('eye-hex');
    const cmd = document.getElementById('cmd-text');

    function render() {
      document.documentElement.style.setProperty('--body', bodyIn.value);
      document.documentElement.style.setProperty('--eye', eyeIn.value);
      bodyHex.textContent = bodyIn.value.toUpperCase();
      eyeHex.textContent = eyeIn.value.toUpperCase();
      cmd.textContent =
        'python3 docs/design/bot-mascot/generate-bot-gif.py --all --body ' + bodyIn.value.toUpperCase() +
        ' --eye ' + eyeIn.value.toUpperCase() + '\n' +
        'python3 docs/design/bot-mascot/generate-bot-gif.py --all --size 128 --body ' +
        bodyIn.value.toUpperCase() + ' --eye ' + eyeIn.value.toUpperCase();
    }

    bodyIn.addEventListener('input', render);
    eyeIn.addEventListener('input', render);

    document.querySelectorAll('.preset').forEach(function (btn) {
      btn.addEventListener('click', function () {
        bodyIn.value = btn.dataset.body;
        eyeIn.value = btn.dataset.eye;
        render();
      });
    });

    document.querySelectorAll('.seg button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.seg button').forEach(function (b) {
          b.setAttribute('aria-pressed', String(b === btn));
        });
        document.querySelectorAll('.stage').forEach(function (s) {
          s.dataset.bg = btn.dataset.bg;
        });
      });
    });

    function flash(btn) {
      btn.textContent = '已复制';
      setTimeout(function () { btn.textContent = '复制命令'; }, 1200);
    }

    document.getElementById('copy').addEventListener('click', function () {
      const btn = this;
      const text = cmd.textContent;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { flash(btn); },
                                                function () { legacyCopy(text, btn); });
      } else {
        legacyCopy(text, btn);
      }
    });

    function legacyCopy(text, btn) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); flash(btn); } catch (e) { btn.textContent = '请手动选中'; }
      document.body.removeChild(ta);
    }

    render();
</script>
</body>
</html>
