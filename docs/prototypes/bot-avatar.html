<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot 头像 · 看一眼</title>
<style>
:root{
  --foreground:#18181b;
  --muted:#71717a;
  --muted-2:#a1a1aa;
  --border:rgba(0,0,0,.09);
  --sidebar:#fafafa;
  --primary:#18181b;
  --quickforge-dur-fast:120ms;
  --quickforge-dur-base:180ms;
  --quickforge-dur-slow:280ms;
  --quickforge-ease-out:cubic-bezier(0.2,0,0,1);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:var(--sidebar);color:var(--foreground);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1{font-size:13px;font-weight:600;color:var(--muted);margin:0;letter-spacing:.02em}
.stage{display:flex;align-items:flex-end;gap:38px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.cell small{font-size:11px;color:var(--muted-2)}

/* —— 与 src/components/bots/bot-avatar.css 保持一致 —— */
.qf-bot-avatar{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.qf-bot-avatar__svg{width:100%;height:100%;overflow:visible}
.qf-bot-avatar__head,.qf-bot-avatar__eye,.qf-bot-avatar__antenna{transform-box:fill-box}
.qf-bot-avatar__svg--pop .qf-bot-avatar__head{transform-origin:center;animation:qf-bot-avatar-pop var(--quickforge-dur-slow) var(--quickforge-ease-out)}
.qf-bot-avatar__svg--pop .qf-bot-avatar__eye{transform-origin:center;animation:qf-bot-avatar-blink var(--quickforge-dur-slow) var(--quickforge-ease-out)}
.qf-bot-avatar__svg--pop .qf-bot-avatar__antenna{transform-origin:bottom center;animation:qf-bot-avatar-wiggle var(--quickforge-dur-slow) var(--quickforge-ease-out)}
@keyframes qf-bot-avatar-pop{0%{transform:scale(1,1)}35%{transform:scale(1.08,.92)}65%{transform:scale(.97,1.05)}100%{transform:scale(1,1)}}
@keyframes qf-bot-avatar-blink{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.12)}70%{transform:scaleY(1.15)}}
@keyframes qf-bot-avatar-wiggle{0%,100%{transform:rotate(0)}35%{transform:rotate(-14deg)}70%{transform:rotate(9deg)}}
@media (prefers-reduced-motion: reduce){
  .qf-bot-avatar__svg--pop .qf-bot-avatar__head,
  .qf-bot-avatar__svg--pop .qf-bot-avatar__eye,
  .qf-bot-avatar__svg--pop .qf-bot-avatar__antenna{animation:none}
}

/* 侧栏按钮里的实际样子 */
.toggle{
  width:30px;height:30px;border-radius:8px;border:0;background:none;cursor:pointer;
  display:grid;place-items:center;color:var(--muted);
  transition:background var(--quickforge-dur-base) var(--quickforge-ease-out),color var(--quickforge-dur-base) var(--quickforge-ease-out);
}
.toggle:hover{background:rgba(0,0,0,.04);color:var(--foreground)}
.toggle:active{background:rgba(0,0,0,.06)}
.hint{font-size:12px;color:var(--muted-2)}
.big{width:64px;height:64px;border-radius:16px;border:1px solid var(--border);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--foreground)}
</style>
</head>
<body>

<h1>Bot 头像 · 点一下试试</h1>

<div class="stage">
  <div class="cell">
    <button class="big" data-pop aria-label="点我"><span class="qf-bot-avatar" data-size="44"><svg class="qf-bot-avatar__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="qf-bot-avatar__antenna" d="M12 6.6V3.8"/><circle class="qf-bot-avatar__antenna" cx="12" cy="2.7" r="1.05" fill="currentColor" stroke="none"/><rect class="qf-bot-avatar__head" x="3.6" y="6.6" width="16.8" height="14" rx="6.6"/><circle class="qf-bot-avatar__eye" cx="9.1" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle class="qf-bot-avatar__eye" cx="14.9" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><path class="qf-bot-avatar__head" d="M10.5 16.1c.85.85 2.15.85 3 0"/></svg></span></button>
    <small>44px · 大图</small>
  </div>

  <div class="cell">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:#fff">
      <button class="toggle" data-pop aria-label="侧栏按钮"><span class="qf-bot-avatar" data-size="17"><svg class="qf-bot-avatar__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="qf-bot-avatar__antenna" d="M12 6.6V3.8"/><circle class="qf-bot-avatar__antenna" cx="12" cy="2.7" r="1.05" fill="currentColor" stroke="none"/><rect class="qf-bot-avatar__head" x="3.6" y="6.6" width="16.8" height="14" rx="6.6"/><circle class="qf-bot-avatar__eye" cx="9.1" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle class="qf-bot-avatar__eye" cx="14.9" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><path class="qf-bot-avatar__head" d="M10.5 16.1c.85.85 2.15.85 3 0"/></svg></span></button>
      <span style="font-size:13px">它就在左上角</span>
    </div>
    <small>17px · 实际尺寸</small>
  </div>

  <div class="cell">
    <span class="qf-bot-avatar" data-size="14"><svg class="qf-bot-avatar__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="qf-bot-avatar__antenna" d="M12 6.6V3.8"/><circle class="qf-bot-avatar__antenna" cx="12" cy="2.7" r="1.05" fill="currentColor" stroke="none"/><rect class="qf-bot-avatar__head" x="3.6" y="6.6" width="16.8" height="14" rx="6.6"/><circle class="qf-bot-avatar__eye" cx="9.1" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><circle class="qf-bot-avatar__eye" cx="14.9" cy="12.5" r="1.3" fill="currentColor" stroke="none"/><path class="qf-bot-avatar__head" d="M10.5 16.1c.85.85 2.15.85 3 0"/></svg></span>
    <small>14px · 最小</small>
  </div>
</div>

<div class="hint">动画只在点击时播一次：眨眼 + 弹一下 + 天线晃。不循环、不常驻。</div>

<script>
(function () {
  document.querySelectorAll('[data-pop]').forEach(function (button) {
    var host = button.querySelector('.qf-bot-avatar')
    button.addEventListener('click', function () {
      var old = host.querySelector('svg')
      var next = old.cloneNode(true)
      next.classList.add('qf-bot-avatar__svg--pop')
      host.replaceChild(next, old)
      void next.getBoundingClientRect()
      setTimeout(function () {
        next.classList.remove('qf-bot-avatar__svg--pop')
      }, 320)
    })
  })
  document.querySelectorAll('.qf-bot-avatar[data-size]').forEach(function (el) {
    el.style.width = el.dataset.size + 'px'
    el.style.height = el.dataset.size + 'px'
  })
})()
</script>
</body>
</html>
