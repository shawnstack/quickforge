    <rect x="268" y="146" width="1140" height="118" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <line x1="553" y1="166" x2="553" y2="244" stroke="#e5e7eb"/>
    <line x1="838" y1="166" x2="838" y2="244" stroke="#e5e7eb"/>
    <line x1="1123" y1="166" x2="1123" y2="244" stroke="#e5e7eb"/>

    <text x="292" y="178" class="muted">今日模型用量</text>
    <text x="292" y="216" class="metric">1.28M</text>
    <text x="292" y="238" class="muted">tokens · 较昨日 +8.4%</text>

    <text x="577" y="178" class="muted">活跃安装实例</text>
    <text x="577" y="216" class="metric">2,416</text>
    <text x="577" y="238" class="muted">24 小时内 318 活跃</text>

    <text x="862" y="178" class="muted">剩余额度</text>
    <text x="862" y="216" class="metric">74.2%</text>
    <text x="862" y="238" class="muted">待过期 18 个 entitlement</text>

    <text x="1147" y="178" class="muted">待处理异常</text>
    <text x="1147" y="216" class="metric" fill="#b45309">7</text>
    <text x="1147" y="238" class="muted">3 个 stale reservation</text>

    <!-- Usage chart -->
    <rect x="268" y="288" width="740" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="292" y="322" class="h2">用量趋势</text>
    <text x="292" y="343" class="muted">最近 7 天 · input + output tokens</text>
    <rect x="880" y="306" width="104" height="28" rx="8" fill="#f7f8fa" stroke="#e5e7eb"/>
    <text x="904" y="324" class="muted">最近 7 天</text>
    <line x1="312" y1="526" x2="974" y2="526" stroke="#e5e7eb"/>
    <line x1="312" y1="472" x2="974" y2="472" stroke="#eef0f3"/>
    <line x1="312" y1="418" x2="974" y2="418" stroke="#eef0f3"/>
    <line x1="312" y1="364" x2="974" y2="364" stroke="#eef0f3"/>
    <polyline points="312,486 420,454 528,468 636,410 744,426 852,382 974,396" fill="none" stroke="#667085" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="312,486 420,454 528,468 636,410 744,426 852,382 974,396 974,526 312,526" fill="#f3f4f6" opacity="0.65"/>
    <text x="306" y="554" class="muted">周一</text><text x="414" y="554" class="muted">周二</text><text x="522" y="554" class="muted">周三</text><text x="630" y="554" class="muted">周四</text><text x="738" y="554" class="muted">周五</text><text x="846" y="554" class="muted">周六</text><text x="954" y="554" class="muted">周日</text>

    <!-- Exceptions -->
    <rect x="1032" y="288" width="376" height="300" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="1056" y="322" class="h2">需要关注</text>
    <text x="1360" y="322" class="muted" text-anchor="end">查看全部</text>

    <circle cx="1064" cy="368" r="5" fill="#f59e0b"/>
    <text x="1080" y="366" class="body">3 个 reservation 超过 15 分钟</text>
    <text x="1080" y="384" class="muted">reconcile worker · 2 分钟前</text>
    <line x1="1056" y1="405" x2="1384" y2="405" stroke="#eef0f3"/>

    <circle cx="1064" cy="438" r="5" fill="#ef4444"/>
    <text x="1080" y="436" class="body">Refresh replay 检测增加</text>
    <text x="1080" y="454" class="muted">过去 1 小时共 4 次</text>
    <line x1="1056" y1="475" x2="1384" y2="475" stroke="#eef0f3"/>

    <circle cx="1064" cy="508" r="5" fill="#94a3b8"/>
    <text x="1080" y="506" class="body">18 个额度将在 7 天内到期</text>
    <text x="1080" y="524" class="muted">需要确认续期策略</text>

    <!-- Recent audit -->
    <rect x="268" y="612" width="1140" height="244" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="292" y="648" class="h2">最近操作</text>
    <text x="1384" y="648" class="muted" text-anchor="end">查看审计日志</text>
    <rect x="292" y="670" width="1092" height="34" rx="6" fill="#f7f8fa"/>
    <text x="308" y="691" class="muted">时间</text><text x="450" y="691" class="muted">操作者</text><text x="620" y="691" class="muted">操作</text><text x="825" y="691" class="muted">目标</text><text x="1205" y="691" class="muted">结果</text>

    <text x="308" y="730" class="body">12:38:22</text><text x="450" y="730" class="body">admin@quickforge</text><text x="620" y="730" class="body">entitlement.grant</text><text x="825" y="730" class="mono">acc_7f3…</text><text x="1205" y="730" class="body" fill="#15803d">成功</text>
    <line x1="292" y1="746" x2="1384" y2="746" stroke="#eef0f3"/>
    <text x="308" y="776" class="body">12:16:04</text><text x="450" y="776" class="body">admin@quickforge</text><text x="620" y="776" class="body">installation.revoke</text><text x="825" y="776" class="mono">ins_9ab…</text><text x="1205" y="776" class="body" fill="#15803d">成功</text>
    <line x1="292" y1="792" x2="1384" y2="792" stroke="#eef0f3"/>
    <text x="308" y="822" class="body">11:49:37</text><text x="450" y="822" class="body">ops@quickforge</text><text x="620" y="822" class="body">model.toggle</text><text x="825" y="822" class="mono">qf-cloud-sonnet</text><text x="1205" y="822" class="body" fill="#15803d">成功</text>
