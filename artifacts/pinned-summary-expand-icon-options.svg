<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">置顶摘要展开图标候选对比</title>
  <desc id="desc">四个 Lucide 图标在 QuickForge 当前 36 像素圆角工具栏按钮中的实际效果，推荐 PanelTopOpen。</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#181b21"/>
    </linearGradient>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .muted { color: #a5abb7; }
      .active { color: #eef1f6; }
    </style>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <circle cx="1080" cy="-30" r="260" fill="#7c8cff" opacity="0.07"/>
  <circle cx="100" cy="540" r="250" fill="#6ee7b7" opacity="0.035"/>

  <g class="ui">
    <text x="60" y="66" fill="#f4f6fa" font-size="28" font-weight="650">置顶摘要 · 展开图标候选</text>
    <text x="60" y="99" fill="#969daa" font-size="15">按当前工具栏按钮尺寸还原：36 × 36px 按钮，18px 图标，Lucide 2px 描边</text>

    <!-- Option 1 -->
    <g transform="translate(60 138)" filter="url(#shadow)">
      <rect width="250" height="286" rx="22" fill="#1f232b" stroke="#7c8cff" stroke-opacity="0.72"/>
      <rect x="16" y="16" width="74" height="28" rx="14" fill="#7c8cff"/>
      <text x="53" y="35" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">推荐</text>
      <g transform="translate(32 73)">
        <rect width="36" height="36" rx="14" fill="#343945"/>
        <g transform="translate(9 9) scale(.75)" class="icon active">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M3 9h18"/>
          <path d="m15 14-3 3-3-3"/>
        </g>
      </g>
      <g transform="translate(93 63) scale(1.5)" class="icon active">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M3 9h18"/>
        <path d="m15 14-3 3-3-3"/>
      </g>
      <text x="24" y="165" fill="#f1f3f7" font-size="18" font-weight="650">PanelTopOpen</text>
      <text x="24" y="196" fill="#c2c7d0" font-size="14">顶部面板 + 向下展开</text>
      <text x="24" y="220" fill="#8f96a3" font-size="13">方向和对象都明确，</text>
      <text x="24" y="240" fill="#8f96a3" font-size="13">最贴合当前交互。</text>
      <rect x="24" y="260" width="202" height="1" fill="#7c8cff" opacity="0.35"/>
    </g>

    <!-- Option 2 -->
    <g transform="translate(337 138)" filter="url(#shadow)">
      <rect width="250" height="286" rx="22" fill="#1f232b" stroke="#343944"/>
      <g transform="translate(32 73)">
        <rect width="36" height="36" rx="14" fill="#2c3039"/>
        <g transform="translate(9 9) scale(.75)" class="icon muted">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="m16 10-4 4-4-4"/>
        </g>
      </g>
      <g transform="translate(93 63) scale(1.5)" class="icon active">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="m16 10-4 4-4-4"/>
      </g>
      <text x="24" y="165" fill="#f1f3f7" font-size="18" font-weight="650">SquareChevronDown</text>
      <text x="24" y="196" fill="#c2c7d0" font-size="14">容器 + 向下箭头</text>
      <text x="24" y="220" fill="#8f96a3" font-size="13">方向很清楚，但更像</text>
      <text x="24" y="240" fill="#8f96a3" font-size="13">普通下拉或选择器。</text>
    </g>

    <!-- Option 3 -->
    <g transform="translate(614 138)" filter="url(#shadow)">
      <rect width="250" height="286" rx="22" fill="#1f232b" stroke="#343944"/>
      <g transform="translate(32 73)">
        <rect width="36" height="36" rx="14" fill="#2c3039"/>
        <g transform="translate(9 9) scale(.75)" class="icon muted">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M3 9h18"/>
        </g>
      </g>
      <g transform="translate(93 63) scale(1.5)" class="icon active">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M3 9h18"/>
      </g>
      <text x="24" y="165" fill="#f1f3f7" font-size="18" font-weight="650">PanelTop</text>
      <text x="24" y="196" fill="#c2c7d0" font-size="14">顶部面板</text>
      <text x="24" y="220" fill="#8f96a3" font-size="13">对象明确，但缺少</text>
      <text x="24" y="240" fill="#8f96a3" font-size="13">“点击后展开”的动作感。</text>
    </g>

    <!-- Option 4 -->
    <g transform="translate(891 138)" filter="url(#shadow)">
      <rect width="250" height="286" rx="22" fill="#1f232b" stroke="#343944"/>
      <g transform="translate(32 73)">
        <rect width="36" height="36" rx="14" fill="#2c3039"/>
        <g transform="translate(9 9) scale(.75)" class="icon muted">
          <path d="M15 3h6v6"/>
          <path d="m21 3-7 7"/>
          <path d="m3 21 7-7"/>
          <path d="M9 21H3v-6"/>
        </g>
      </g>
      <g transform="translate(93 63) scale(1.5)" class="icon active">
        <path d="M15 3h6v6"/>
        <path d="m21 3-7 7"/>
        <path d="m3 21 7-7"/>
        <path d="M9 21H3v-6"/>
      </g>
      <text x="24" y="165" fill="#f1f3f7" font-size="18" font-weight="650">Maximize2</text>
      <text x="24" y="196" fill="#c2c7d0" font-size="14">放大 / 展开</text>
      <text x="24" y="220" fill="#8f96a3" font-size="13">动作感强，但容易被</text>
      <text x="24" y="240" fill="#8f96a3" font-size="13">理解为全屏或最大化。</text>
    </g>

    <g transform="translate(60 459)">
      <rect width="1080" height="1" fill="#ffffff" opacity="0.08"/>
      <text x="0" y="36" fill="#b5bbc6" font-size="14">建议：</text>
      <text x="48" y="36" fill="#dfe3ea" font-size="14" font-weight="650">PanelTopOpen</text>
      <text x="157" y="36" fill="#9299a6" font-size="14">— 同时表达“置顶面板”和“向下展开”，与手动 Minimize / X 的语义区分最清楚。</text>
    </g>
  </g>
</svg>
