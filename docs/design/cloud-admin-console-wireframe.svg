<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">QuickForge Cloud 管理后台桌面端低保真设计（v2 · 对齐 QF 客户端设计语言）</title>
  <desc id="desc">左侧轻量导航，右侧顶栏与概览内容：指标行、用量趋势、需要关注、最近操作。弱边框、无卡片墙、zinc 配色。</desc>
  <defs>
    <style>
      .ui { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .title { font-size: 16px; font-weight: 600; fill: #18181b; }
      .h3 { font-size: 14px; font-weight: 600; fill: #18181b; }
      .body { font-size: 13px; fill: #3f3f46; }
      .muted { font-size: 12px; fill: #71717a; }
      .faint { font-size: 11.5px; fill: #a1a1aa; }
      .metric { font-size: 26px; font-weight: 650; fill: #18181b; }
      .nav-item { font-size: 13px; fill: #52525b; }
      .nav-active { font-size: 13px; font-weight: 550; fill: #18181b; }
      .th { font-size: 11.5px; font-weight: 550; fill: #a1a1aa; }
      .cell { font-size: 13px; fill: #3f3f46; }
      .mono-cell { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #3f3f46; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>

  <!-- ===== 侧栏：轻量导航 #f4f4f5 ===== -->
  <rect x="0" y="0" width="216" height="900" fill="#f4f4f5"/>
  <line x1="215.5" y1="0" x2="215.5" y2="900" stroke="#e4e4e7"/>
  <g class="ui">
    <!-- 品牌 -->
    <g transform="translate(16,20)">
      <polygon points="12,0 19.5,4.5 19.5,13.5 12,18 4.5,13.5 4.5,4.5" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14.2 3 L8 12.5 L11.6 12.5 L10 17 L16.5 9.5 L12.9 9.5 Z" fill="#374151"/>
    </g>
    <text x="42" y="33" class="body" font-weight="600" fill="#18181b">QuickForge Cloud</text>
    <text x="16" y="66" class="faint" letter-spacing="0.5">运营管理</text>

    <!-- 导航 -->
    <rect x="12" y="76" width="192" height="34" rx="6" fill="#d9d9de"/>
    <text x="24" y="97" class="nav-active">概览</text>
    <text x="24" y="135" class="nav-item">安装实例</text>
    <text x="24" y="173" class="nav-item">额度管理</text>
    <text x="24" y="211" class="nav-item">模型目录</text>
    <text x="24" y="249" class="nav-item">审计日志</text>

    <!-- 底部环境 -->
    <line x1="16" y1="820" x2="200" y2="820" stroke="#e4e4e7"/>
    <circle cx="24" cy="840" r="3.5" fill="#22a45d"/>
    <text x="34" y="844" class="body" fill="#3f3f46">Production</text>
    <text x="16" y="866" class="mono faint">cloud.quickforge.io</text>
    <text x="16" y="884" class="faint">会话 43 分钟后过期</text>
  </g>

  <!-- ===== 顶栏 ===== -->
  <rect x="216" y="0" width="1224" height="56" fill="#ffffff"/>
  <line x1="216" y1="55.5" x2="1440" y2="55.5" stroke="#e4e4e7"/>
  <g class="ui">
    <text x="244" y="35" class="title">概览</text>
    <!-- 服务正常徽标 -->
    <rect x="1176" y="15" width="84" height="26" rx="13" fill="#f0fdf4"/>
    <circle cx="1194" cy="28" r="3.5" fill="#22a45d"/>
    <text x="1202" y="32" font-size="12" fill="#15803d">服务正常</text>
    <!-- 刷新 + 退出 -->
    <rect x="1274" y="15" width="30" height="26" rx="7" fill="#ffffff" stroke="#e4e4e7"/>
    <path d="M1285 22a7 7 0 1 0 2 5M1285 19v4h4" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="1314" y="15" width="62" height="26" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="1330" y="32" font-size="12" fill="#3f3f46">退出</text>
  </g>

  <!-- ===== 内容区 ===== -->
  <g class="ui">
    <text x="244" y="90" class="muted">系统运行概况 · 数据每 60 秒刷新</text>

    <!-- 指标行：竖线分隔，无卡片 -->
    <g>
      <text x="244" y="128" class="muted">今日模型用量</text>
      <text x="244" y="162" class="metric">1.28M</text>
      <text x="244" y="182" class="faint">tokens · 较昨日 +8.4%</text>
      <line x1="548" y1="108" x2="548" y2="190" stroke="#e4e4e7"/>

      <text x="572" y="128" class="muted">活跃安装实例</text>
      <text x="572" y="162" class="metric">2,416</text>
      <text x="572" y="182" class="faint">24 小时活跃率 78%</text>
      <line x1="876" y1="108" x2="876" y2="190" stroke="#e4e4e7"/>

      <text x="900" y="128" class="muted">剩余额度</text>
      <text x="900" y="162" class="metric">74.2%</text>
      <text x="900" y="182" class="faint">18 个 entitlement 7 天内到期</text>
      <line x1="1204" y1="108" x2="1204" y2="190" stroke="#e4e4e7"/>

      <text x="1228" y="128" class="muted">需要关注</text>
      <text x="1228" y="162" class="metric">7</text>
      <text x="1228" y="182" class="faint">3 stale reservation · 4 replay</text>
      <line x1="216" y1="202" x2="1440" y2="202" stroke="#e4e4e7"/>
    </g>

    <!-- 用量趋势（左） -->
    <text x="244" y="240" class="h3">用量趋势</text>
    <text x="244" y="258" class="muted">最近 7 天 · input + output tokens</text>

    <g>
      <line x1="244" y1="292" x2="840" y2="292" stroke="#f1f1f3"/>
      <line x1="244" y1="330" x2="840" y2="330" stroke="#f1f1f3"/>
      <line x1="244" y1="368" x2="840" y2="368" stroke="#f1f1f3"/>
      <line x1="244" y1="406" x2="840" y2="406" stroke="#e4e4e7"/>
      <polyline points="244,352 335,318 426,336 517,284 608,300 699,264 840,282" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="244,352 335,318 426,336 517,284 608,300 699,264 840,282 840,406 244,406" fill="#f4f4f5"/>
      <polyline points="244,372 335,352 426,362 517,326 608,338 699,310 840,322" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <g font-size="11" fill="#a1a1aa">
        <text x="244" y="428" text-anchor="middle">周一</text><text x="335" y="428" text-anchor="middle">周二</text>
        <text x="426" y="428" text-anchor="middle">周三</text><text x="517" y="428" text-anchor="middle">周四</text>
        <text x="608" y="428" text-anchor="middle">周五</text><text x="699" y="428" text-anchor="middle">周六</text>
        <text x="840" y="428" text-anchor="middle">周日</text>
      </g>
      <line x1="244" y1="452" x2="268" y2="452" stroke="#52525b" stroke-width="2"/>
      <text x="276" y="456" class="muted">Input</text>
      <line x1="330" y1="452" x2="354" y2="452" stroke="#a1a1aa" stroke-width="1.5"/>
      <text x="362" y="456" class="muted">Output</text>
    </g>

    <!-- 需要关注（右） -->
    <text x="908" y="240" class="h3">需要关注</text>
    <text x="908" y="258" class="muted">异常与待处理事项</text>
    <g>
      <circle cx="914" cy="286" r="4" fill="#f59e0b"/>
      <text x="928" y="289" class="body" fill="#3f3f46">3 个 reservation 超过 15 分钟</text>
      <text x="928" y="306" class="faint">reconcile worker · 2 分钟前扫描</text>
      <line x1="908" y1="322" x2="1416" y2="322" stroke="#f1f1f3"/>

      <circle cx="914" cy="344" r="4" fill="#ef4444"/>
      <text x="928" y="347" class="body" fill="#3f3f46">Refresh replay 检测新增 4 例</text>
      <text x="928" y="364" class="faint">过去 1 小时 · 来自 2 个安装</text>
      <line x1="908" y1="380" x2="1416" y2="380" stroke="#f1f1f3"/>

      <circle cx="914" cy="402" r="4" fill="#a1a1aa"/>
      <text x="928" y="405" class="body" fill="#3f3f46">18 个额度将在 7 天内到期</text>
      <text x="928" y="422" class="faint">需要确认续期策略</text>
    </g>

    <!-- 最近操作（全宽表格） -->
    <line x1="216" y1="478" x2="1440" y2="478" stroke="#e4e4e7"/>
    <text x="244" y="506" class="h3">最近操作</text>
    <text x="244" y="524" class="muted">最近 5 条管理写操作</text>
    <text x="1416" y="516" text-anchor="end" font-size="12" fill="#71717a">查看审计日志</text>

    <g>
      <text x="244" y="556" class="th">时间</text><text x="420" y="556" class="th">操作者</text>
      <text x="620" y="556" class="th">操作</text><text x="820" y="556" class="th">目标</text>
      <text x="1340" y="556" class="th" text-anchor="end">结果</text>
      <line x1="244" y1="566" x2="1416" y2="566" stroke="#f1f1f3"/>

      <text x="244" y="594" class="mono-cell">12:38:22</text>
      <text x="420" y="594" class="mono-cell">key:9f3ab2c1</text>
      <text x="620" y="594" class="mono-cell">entitlement.grant</text>
      <text x="820" y="594" class="mono-cell">ent_3f1a88</text>
      <rect x="1296" y="582" width="120" height="24" rx="12" fill="#f0fdf4"/>
      <circle cx="1310" cy="594" r="3" fill="#22a45d"/>
      <text x="1318" y="598" font-size="12" fill="#15803d">成功</text>
      <line x1="244" y1="610" x2="1416" y2="610" stroke="#f1f1f3"/>

      <text x="244" y="638" class="mono-cell">12:16:04</text>
      <text x="420" y="638" class="mono-cell">key:9f3ab2c1</text>
      <text x="620" y="638" class="mono-cell">installation.revoke</text>
      <text x="820" y="638" class="mono-cell">ins_8b4f12c9</text>
      <rect x="1296" y="626" width="120" height="24" rx="12" fill="#f0fdf4"/>
      <circle cx="1310" cy="638" r="3" fill="#22a45d"/>
      <text x="1318" y="642" font-size="12" fill="#15803d">成功</text>
      <line x1="244" y1="654" x2="1416" y2="654" stroke="#f1f1f3"/>

      <text x="244" y="682" class="mono-cell">11:49:37</text>
      <text x="420" y="682" class="mono-cell">key:7a1c0d9e</text>
      <text x="620" y="682" class="mono-cell">model.toggle</text>
      <text x="820" y="682" class="mono-cell">qf-cloud-opus</text>
      <rect x="1296" y="670" width="120" height="24" rx="12" fill="#f0fdf4"/>
      <circle cx="1310" cy="682" r="3" fill="#22a45d"/>
      <text x="1318" y="686" font-size="12" fill="#15803d">成功</text>
      <line x1="244" y1="698" x2="1416" y2="698" stroke="#f1f1f3"/>

      <text x="244" y="726" class="mono-cell">11:02:51</text>
      <text x="420" y="726" class="mono-cell">key:7a1c0d9e</text>
      <text x="620" y="726" class="mono-cell">catalog.sync</text>
      <text x="820" y="726" class="mono-cell">catalog.json</text>
      <rect x="1296" y="714" width="120" height="24" rx="12" fill="#f0fdf4"/>
      <circle cx="1310" cy="726" r="3" fill="#22a45d"/>
      <text x="1318" y="730" font-size="12" fill="#15803d">成功</text>
      <line x1="244" y1="742" x2="1416" y2="742" stroke="#f1f1f3"/>

      <text x="244" y="770" class="mono-cell">10:27:33</text>
      <text x="420" y="770" class="mono-cell">key:9f3ab2c1</text>
      <text x="620" y="770" class="mono-cell">entitlement.revoke</text>
      <text x="820" y="770" class="mono-cell">ent_9e0d12</text>
      <rect x="1296" y="758" width="120" height="24" rx="12" fill="#f0fdf4"/>
      <circle cx="1310" cy="770" r="3" fill="#22a45d"/>
      <text x="1318" y="774" font-size="12" fill="#15803d">成功</text>
    </g>
  </g>
</svg>
