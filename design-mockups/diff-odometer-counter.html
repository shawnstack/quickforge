<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Diff Odometer Counter — 工具卡片实时 +N/-M 滚动数字样稿</title>
<style>
  :root {
    --add: #1a9c60;
    --add-weak: rgba(26, 156, 96, 0.12);
    --del: #d4472e;
    --del-weak: rgba(212, 71, 46, 0.12);
    --ink: #d6d9de;
    --ink-dim: #8b919b;
    --card: #1c1e22;
    --card-edge: #2a2d33;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  body {
    margin: 0; background: #141518; color: var(--ink);
    font: 13px/1.6 var(--mono);
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 40px 16px;
  }
  h1 { font-size: 15px; font-weight: 600; color: var(--ink-dim); margin: 0 0 8px; }
  .hint { color: var(--ink-dim); font-size: 12px; }

  /* ---- 工具卡片（模拟现有 quickforge 工具摘要卡） ---- */
  .tool-card {
    width: 560px; max-width: 100%;
    background: var(--card); border: 1px solid var(--card-edge); border-radius: 8px;
    padding: 10px 12px; display: flex; align-items: center; gap: 10px;
  }
  .spinner {
    width: 13px; height: 13px; flex: none; border-radius: 50%;
    border: 2px solid #3a3e46; border-top-color: #9aa3b0;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary .dim { color: var(--ink-dim); }

  /* ---- 里程计式 +N/-M 计数器 ---- */
  .diff-counter {
    flex: none; display: inline-flex; align-items: baseline; gap: 8px;
    font: 600 12px/1 var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .side { display: inline-flex; align-items: baseline; gap: 2px; }
  .side.add { color: var(--add); }
  .side.del { color: var(--del); }
  .side .sign { opacity: .8; }
  /* 每位数字一列，列内 0-9 垂直堆叠，位移实现滚动 */
  .digit {
    display: inline-block; height: 1em; overflow: hidden; vertical-align: bottom;
    position: relative;
  }
  .digit-strip {
    display: flex; flex-direction: column; align-items: center;
    transition: transform 380ms cubic-bezier(.22, 1, .36, 1);
    will-change: transform;
  }
  .digit-strip span { height: 1em; line-height: 1; }
  /* 进位新增的列从上方淡入并下落 */
  .digit.enter .digit-strip { animation: digit-enter 380ms cubic-bezier(.22, 1, .36, 1); }
  @keyframes digit-enter {
    from { opacity: 0; transform: translateY(-1em); }
    to   { opacity: 1; }
  }
  /* running 时整组轻微呼吸，结束定格 */
  .diff-counter.running { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }

  /* run again 按钮 */
  button {
    font: 12px var(--mono); color: var(--ink); background: #26292f;
    border: 1px solid var(--card-edge); border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  button:hover { background: #2f333a; }
</style>
</head>
<body>
  <h1>diff-odometer-counter — 工具卡片实时 ±行数滚动数字</h1>
  <div class="hint">模拟 Edit/Write 工具执行：running 期间每次 partial update 累计滚动，结束定格</div>

  <div class="tool-card">
    <div class="spinner"></div>
    <div class="summary"><span class="dim">edit_file</span> src/lib/local-tools.ts</div>
    <diff-counter id="c1"></diff-counter>
  </div>

  <div class="tool-card">
    <div class="spinner"></div>
    <div class="summary"><span class="dim">write_file</span> server/tools/new-module.mjs</div>
    <diff-counter id="c2"></diff-counter>
  </div>

  <button onclick="run()">↻ 重播</button>

<script>
  // ---- Odometer 数字列实现 ----
  function digitColumn(d, enter) {
    const col = document.createElement('span');
    col.className = 'digit' + (enter ? ' enter' : '');
    const strip = document.createElement('span');
    strip.className = 'digit-strip';
    for (let i = 0; i <= 9; i++) {
      const s = document.createElement('span');
      s.textContent = i;
      strip.appendChild(s);
    }
    strip.style.transform = `translateY(-${d}em)`;
    col.appendChild(strip);
    return col;
  }

  class DiffCounter extends HTMLElement {
    connectedCallback() { this.set(0, 0, true); }
    set(added, removed, running) {
      this.classList.toggle('running', running);
      for (const side of ['add', 'del']) {
        const n = side === 'add' ? added : removed;
        const digits = String(n).split('');
        let el = this.querySelector('.side.' + side);
        if (!el) {
          el = document.createElement('span');
          el.className = 'side ' + side;
          const sign = document.createElement('span');
          sign.className = 'sign';
          sign.textContent = side === 'add' ? '+' : '−';
          el.appendChild(sign);
          this.appendChild(el);
        }
        // 逐位比较：位数增长时新增列（enter 动画），否则仅滚动对应列
        const prevLen = el.querySelectorAll('.digit').length;
        digits.forEach((d, i) => {
          const idx = i - (digits.length - prevLen); // 右对齐：新增位在左侧
          let col = el.querySelectorAll('.digit')[Math.max(idx, 0)];
          if (!col || idx < 0) {
            col = digitColumn(+d, true);
            el.insertBefore(col, el.children[1] || null);
          } else {
            col.querySelector('.digit-strip')
               .style.transform = `translateY(-${d}em)`;
            col.classList.remove('enter');
          }
        });
      }
    }
  }
  customElements.define('diff-counter', DiffCounter);

  // ---- 模拟执行时间线 ----
  function run() {
    const c1 = document.getElementById('c1');
    const c2 = document.getElementById('c2');
    // edit_file: 多次 replace，每次 partial update 累计
    const timeline1 = [[3,1],[8,2],[14,3],[21,5],[27,6],[34,9]];
    // write_file: 单次写入，结束后一次性从 0 滚到最终值
    const final2 = [128, 0];
    c1.set(0, 0, true); c2.set(0, 0, true);
    timeline1.forEach(([a, r], i) =>
      setTimeout(() => c1.set(a, r, true), 350 * (i + 1)));
    setTimeout(() => { c1.set(34, 9, false); }, 350 * (timeline1.length + 1) + 300);
    setTimeout(() => c2.set(final2[0], final2[1], false), 350 * 4);
  }
  run();
</script>
</body>
</html>
