<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">为什么页面一直开着，内存会爆掉？—— 用仓库打个比方</text>

  <!-- Three bubbles -->
  <rect x="30" y="58" width="292" height="80" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="46" y="82" font-size="13.5" font-weight="700" fill="#b91c1c">① 只进不出</text>
  <text x="46" y="102" font-size="11.5" fill="#7f1d1d">聊天和工具的记录从来不清理；系统的"压缩"</text>
  <text x="46" y="118" font-size="11.5" fill="#7f1d1d">只压缩发给 AI 的部分，原件全堆着</text>

  <rect x="352" y="58" width="292" height="80" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <text x="368" y="82" font-size="13.5" font-weight="700" fill="#b45309">② 一份变多份</text>
  <text x="368" y="102" font-size="11.5" fill="#92400e">同一条内容至少存 3 份：原始数据 + 界面展示</text>
  <text x="368" y="118" font-size="11.5" fill="#92400e">（代码高亮还要再放大 3~5 倍）+ 定期存档</text>

  <rect x="674" y="58" width="296" height="80" rx="12" fill="#f8fafc" stroke="#64748b"/>
  <text x="690" y="82" font-size="13.5" font-weight="700" fill="#334155">③ 没有限高、没有报警</text>
  <text x="690" y="102" font-size="11.5" fill="#475569">整个系统不设内存上限、没有监控提醒，</text>
  <text x="690" y="118" font-size="11.5" fill="#475569">页面开着就一直堆，直到塌方</text>

  <!-- leader lines from bubbles to warehouse -->
  <line x1="176" y1="138" x2="230" y2="392" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="498" y1="138" x2="470" y2="330" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="822" y1="138" x2="700" y2="190" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Warehouse -->
  <!-- floor -->
  <line x1="100" y1="500" x2="920" y2="500" stroke="#334155" stroke-width="4"/>
  <!-- left wall with door gap -->
  <line x1="100" y1="210" x2="100" y2="420" stroke="#334155" stroke-width="4"/>
  <line x1="100" y1="478" x2="100" y2="500" stroke="#334155" stroke-width="4"/>
  <!-- right wall -->
  <line x1="920" y1="210" x2="920" y2="500" stroke="#334155" stroke-width="4"/>
  <!-- roof: broken on right side -->
  <path d="M 80 210 L 500 140 L 620 160" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 690 169 L 940 210" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- boxes piling up, ever higher -->
  <g stroke="#92400e" stroke-width="1.5" fill="#fbbf24">
    <rect x="130" y="440" width="70" height="60"/>
    <rect x="210" y="390" width="70" height="110"/>
    <rect x="290" y="340" width="70" height="160"/>
    <rect x="370" y="290" width="70" height="210"/>
    <rect x="450" y="240" width="70" height="260"/>
    <rect x="530" y="196" width="70" height="304"/>
    <rect x="610" y="140" width="70" height="360"/>
    <rect x="690" y="176" width="70" height="324"/>
  </g>
  <text x="165" y="474" text-anchor="middle" font-size="11" fill="#78350f">聊天记录</text>
  <text x="245" y="449" text-anchor="middle" font-size="11" fill="#78350f">工具结果</text>
  <text x="325" y="424" text-anchor="middle" font-size="11" fill="#78350f">代码块</text>
  <text x="405" y="399" text-anchor="middle" font-size="11" fill="#78350f">小弟的</text>
  <text x="405" y="413" text-anchor="middle" font-size="11" fill="#78350f">完整记录</text>
  <text x="485" y="374" text-anchor="middle" font-size="11" fill="#78350f">图片</text>

  <!-- explosion at roof breach -->
  <g>
    <circle cx="655" cy="140" r="34" fill="#ef4444" opacity="0.25"/>
    <circle cx="655" cy="140" r="20" fill="#ef4444" opacity="0.45"/>
    <path d="M 655 108 L 662 128 L 684 122 L 670 140 L 690 152 L 668 152 L 672 174 L 655 158 L 638 174 L 642 152 L 620 152 L 640 140 L 626 122 L 648 128 Z" fill="#ef4444"/>
    <text x="655" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">OOM</text>
    <text x="742" y="120" font-size="13" font-weight="700" fill="#b91c1c">内存爆了，页面崩溃</text>
  </g>

  <!-- incoming conveyor -->
  <line x1="26" y1="452" x2="96" y2="452" stroke="#dc2626" stroke-width="3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="60" y="432" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">边聊边进</text>
  <text x="60" y="486" text-anchor="middle" font-size="10.5" fill="#7f1d1d">从来不清走</text>

  <!-- bottom fix bar -->
  <rect x="30" y="532" width="940" height="72" rx="12" fill="#0f172a"/>
  <text x="500" y="560" text-anchor="middle" font-size="13.5" font-weight="700" fill="#86efac">最见效的修法：把老记录装箱收起来，只展开最近几十条</text>
  <text x="500" y="584" text-anchor="middle" font-size="12" fill="#cbd5e1">内存立刻从"全部历史"降到"一小段"—— 这个功能代码里已经写好了，只是被人为关掉了（为了保留"跳转历史消息"的体验）</text>
</svg>
