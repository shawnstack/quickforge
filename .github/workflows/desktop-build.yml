name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Build desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            script: desktop:build:win
            artifact: quickforge-desktop-windows
          - name: macos
            os: macos-latest
            script: desktop:build:mac
            artifact: quickforge-desktop-macos
          - name: linux
            os: ubuntu-latest
            script: desktop:build:linux
            artifact: quickforge-desktop-linux

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.19.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.x
          cache: 'npm'

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2

      - run: npm ci

      - name: Build ${{ matrix.name }} desktop package
        run: npm run ${{ matrix.script }}

      - name: Upload ${{ matrix.name }} desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop-dist/*.exe
            desktop-dist/*.dmg
            desktop-dist/*.AppImage
            desktop-dist/*.zip
            desktop-dist/*.blockmap
            desktop-dist/*.yml
            desktop-dist/*.yaml

  release:
    name: Create GitHub Release
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: quickforge-desktop-*
          path: release-assets

      - name: Create or update GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -d '' assets < <(find release-assets -type f -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found in release-assets"
            exit 1
          fi

          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "$REPO" \
              --title "QuickForge $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --repo "$REPO" \
              --title "QuickForge $TAG_NAME" \
              --generate-notes
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" \
            --repo "$REPO" \
            --clobber
