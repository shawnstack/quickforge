<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowG2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="640" fill="#ffffff"/>

  <text x="570" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">浏览器渲染进程 OOM：一条消息 × 多份驻留 × DOM 放大</text>
  <text x="570" y="62" text-anchor="middle" font-size="12" fill="#64748b">无典型"泄漏"——是设计上的无界：消息只增不减 + DOM 无窗口化 + 同一内容在前端反复复制</text>

  <!-- Source box -->
  <rect x="30" y="84" width="1080" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">SSE 事件流（页面开着 = 连接常驻）</text>
  <text x="570" y="130" text-anchor="middle" font-size="11" fill="#7f1d1d">message_update：每个 chunk 携带全量累积消息 ｜ tool_execution_*：toolResult.details 全文（服务端不剥离 details）</text>
  <text x="570" y="148" text-anchor="middle" font-size="11" fill="#7f1d1d">read_file ≤50k / diff ≤60k / run_command ~3×预览副本 / run_subagent：子代理完整历史无上限嵌入 + 每 150ms 全量重发</text>

  <!-- arrows from source to pools -->
  <line x1="161" y1="160" x2="161" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR2)"/>
  <line x1="437" y1="160" x2="437" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR2)"/>
  <line x1="713" y1="160" x2="713" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR2)"/>
  <line x1="989" y1="160" x2="989" y2="196" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowR2)"/>

  <!-- Pool 1: messages array -->
  <rect x="30" y="200" width="262" height="290" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="30" y="200" width="262" height="34" rx="10" fill="#0f172a"/>
  <rect x="30" y="218" width="262" height="16" fill="#0f172a"/>
  <text x="161" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">① JS 堆：messages[]</text>

  <text x="44" y="256" font-size="11.5" fill="#334155">• 只增不减，仅服务端</text>
  <text x="44" y="272" font-size="11.5" fill="#334155">  compact / rollback 才缩短</text>
  <text x="44" y="296" font-size="11.5" fill="#334155">• toolResult.details 全文驻留，</text>
  <text x="44" y="312" font-size="11.5" fill="#334155">  subagent 整个子历史无上限</text>
  <text x="44" y="328" font-size="11.5" fill="#334155">  嵌入（agent-manager:1795）</text>
  <text x="44" y="352" font-size="11.5" fill="#334155">• 切换会话才释放；</text>
  <text x="44" y="368" font-size="11.5" fill="#334155">  单会话内永不收缩</text>
  <text x="44" y="392" font-size="11.5" fill="#334155">• 工具流式事件每个触发</text>
  <text x="44" y="408" font-size="11.5" fill="#334155">  O(n) 扫描 + 全数组复制</text>
  <rect x="44" y="432" width="180" height="26" rx="13" fill="#fee2e2"/>
  <text x="134" y="450" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">驻留 ≈ 全文 × 条数（线性）</text>

  <!-- Pool 2: DOM -->
  <rect x="306" y="200" width="262" height="290" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="306" y="200" width="262" height="34" rx="10" fill="#7f1d1d"/>
  <rect x="306" y="218" width="262" height="16" fill="#7f1d1d"/>
  <text x="437" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">② DOM：全量渲染（主因）</text>

  <text x="320" y="256" font-size="11.5" fill="#334155">• message-list 无任何虚拟化；</text>
  <text x="320" y="272" font-size="11.5" fill="#334155">  窗口化被禁用（enabled:false，</text>
  <text x="320" y="288" font-size="11.5" fill="#334155">  ChatPanelHost:600）</text>
  <text x="320" y="312" font-size="11.5" fill="#334155">• code-block：代码全文以</text>
  <text x="320" y="328" font-size="11.5" fill="#334155">  base64 属性再存一份 ≈1.33×</text>
  <text x="320" y="352" font-size="11.5" fill="#334155">• hljs 高亮逐 token 建 span</text>
  <text x="320" y="368" font-size="11.5" fill="#334155">  树 ≈ 文本的 3-5 倍节点</text>
  <text x="320" y="392" font-size="11.5" fill="#b45309">• max-h 限高 / CSS 折叠只是</text>
  <text x="320" y="408" font-size="11.5" fill="#b45309">  视觉——节点全部驻留内存</text>
  <rect x="320" y="432" width="200" height="26" rx="13" fill="#fee2e2"/>
  <text x="420" y="450" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">DOM ≈ 文本 3-6×，随条数线性</text>

  <!-- Pool 3: IndexedDB -->
  <rect x="582" y="200" width="262" height="290" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <rect x="582" y="200" width="262" height="34" rx="10" fill="#78350f"/>
  <rect x="582" y="218" width="262" height="16" fill="#78350f"/>
  <text x="713" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">③ IndexedDB 快照（同进程）</text>

  <text x="596" y="256" font-size="11.5" fill="#334155">• 防抖 1.5s flush：</text>
  <text x="596" y="272" font-size="11.5" fill="#334155">  estimateBytes = 对整个会话</text>
  <text x="596" y="288" font-size="11.5" fill="#334155">  （含全部 details/base64）</text>
  <text x="596" y="304" font-size="11.5" fill="#334155">  JSON.stringify 一遍</text>
  <text x="596" y="328" font-size="11.5" fill="#334155">• put 后 evictIfNeeded 调</text>
  <text x="596" y="344" font-size="11.5" fill="#334155">  getAll()：把全部 ~40 个缓存</text>
  <text x="596" y="360" font-size="11.5" fill="#334155">  会话快照反序列化回 JS 堆，</text>
  <text x="596" y="376" font-size="11.5" fill="#334155">  只取元数据后丢弃</text>
  <text x="596" y="400" font-size="11.5" fill="#334155">• structured clone 传输再复制</text>
  <rect x="596" y="432" width="200" height="26" rx="13" fill="#fde68a"/>
  <text x="696" y="450" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">瞬时放大 ≈ 全部缓存会话之和</text>

  <!-- Pool 4: store -->
  <rect x="858" y="200" width="252" height="290" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="858" y="200" width="252" height="34" rx="10" fill="#0f172a"/>
  <rect x="858" y="218" width="252" height="16" fill="#0f172a"/>
  <text x="984" y="223" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">④ subagentRunStore 快照</text>

  <text x="872" y="256" font-size="11.5" fill="#334155">• 每 150ms 节流的 trace 把</text>
  <text x="872" y="272" font-size="11.5" fill="#334155">  全量 details pretty-print</text>
  <text x="872" y="288" font-size="11.5" fill="#334155">  成 JSON 字符串存快照</text>
  <text x="872" y="312" font-size="11.5" fill="#334155">• 运行快照上限 100 条</text>
  <text x="872" y="336" font-size="11.5" fill="#334155">• 与 ①② 中同一份内容</text>
  <text x="872" y="352" font-size="11.5" fill="#334155">  再复制一份驻留</text>
  <text x="872" y="376" font-size="11.5" fill="#64748b">• 流式期间另每 rAF 深克隆</text>
  <text x="872" y="392" font-size="11.5" fill="#64748b">  整条消息 + 全文重解析</text>
  <text x="872" y="408" font-size="11.5" fill="#64748b">  （GC 压力 / 堆碎片）</text>
  <rect x="872" y="432" width="170" height="26" rx="13" fill="#e2e8f0"/>
  <text x="957" y="450" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">≈1.5-2× 原始 JSON</text>

  <!-- Bottom conclusions -->
  <rect x="30" y="516" width="1080" height="106" rx="10" fill="#0f172a"/>
  <text x="50" y="544" font-size="12.5" font-weight="700" fill="#f87171">决定性主因：①+② —— 内存 ≈ 消息条数 × 单条体积 × DOM 放大倍数，线性增长、永不收缩（只有切换/关闭会话才释放）</text>
  <text x="50" y="568" font-size="12.5" font-weight="700" fill="#fbbf24">高频放大器：③+④ 在工具密集会话每 1.5s / 150ms 反复触发，瞬时堆峰值与碎片持续抬升、老年代不回落</text>
  <text x="50" y="592" font-size="12.5" font-weight="700" fill="#a5b4fc">修复杠杆：恢复窗口化（DOM 从 O(全部历史)→O(窗口)）＞ subagent details 增量化/剥离 ＞ estimateBytes 与 getAll 修复 ＞ 超长输出 DOM 截断</text>
</svg>
