<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f1d1d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1140" height="660" fill="#ffffff"/>

  <text x="570" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">QuickForge「页面一直开着 → OOM」机制分析</text>
  <text x="570" y="64" text-anchor="middle" font-size="12" fill="#64748b">三层叠加：服务端会话被钉死（主因）· 前端消息/DOM 无界 · Electron 同堆放大 —— 全链路无内存监控、无堆上限</text>

  <!-- Renderer box -->
  <rect x="30" y="100" width="250" height="430" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="30" y="100" width="250" height="36" rx="10" fill="#0f172a"/>
  <rect x="30" y="118" width="250" height="18" fill="#0f172a"/>
  <text x="155" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">浏览器 Renderer（页面）</text>

  <rect x="42" y="148" width="226" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="42" y="154" width="3" height="76" rx="1.5" fill="#dc2626"/>
  <text x="54" y="170" font-size="13" font-weight="700" fill="#b91c1c">messages[] 只增不减</text>
  <text x="54" y="188" font-size="11" fill="#64748b">客户端无任何裁剪，仅服务端</text>
  <text x="54" y="203" font-size="11" fill="#64748b">compact / rollback 时才缩短</text>

  <rect x="42" y="242" width="226" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="42" y="248" width="3" height="76" rx="1.5" fill="#dc2626"/>
  <text x="54" y="264" font-size="13" font-weight="700" fill="#b91c1c">DOM 全量渲染（无窗口化）</text>
  <text x="54" y="282" font-size="11" fill="#64748b">消息窗口化被硬编码关闭</text>
  <text x="54" y="297" font-size="11" fill="#64748b">(enabled:false)，每条消息的完整</text>
  <text x="54" y="312" font-size="11" fill="#64748b">DOM 子树随会话长度线性增长</text>

  <rect x="42" y="336" width="226" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="42" y="342" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="54" y="358" font-size="13" font-weight="700" fill="#b45309">高频全量复制（GC 碎片）</text>
  <text x="54" y="376" font-size="11" fill="#64748b">每个流式事件触发 O(n) 扫描</text>
  <text x="54" y="391" font-size="11" fill="#64748b">+ 全量数组复制，长会话持续</text>
  <text x="54" y="406" font-size="11" fill="#64748b">推高老年代峰值与堆碎片</text>

  <rect x="42" y="430" width="226" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="42" y="436" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="54" y="452" font-size="13" font-weight="700" fill="#b45309">卡死的后台任务</text>
  <text x="54" y="470" font-size="11" fill="#64748b">running / isStreaming 永不淘汰，</text>
  <text x="54" y="485" font-size="11" fill="#64748b">各持完整消息、SSE 订阅与</text>
  <text x="54" y="500" font-size="11" fill="#64748b">5s watchdog 轮询定时器</text>

  <!-- SSE arrows -->
  <text x="335" y="228" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">SSE 事件流</text>
  <text x="335" y="241" text-anchor="middle" font-size="10" fill="#64748b">含全量 message_update</text>
  <line x1="388" y1="252" x2="286" y2="252" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>

  <text x="335" y="278" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">: ping 每 15s</text>
  <text x="335" y="291" text-anchor="middle" font-size="10" fill="#94a3b8">keepalive 保活</text>
  <line x1="388" y1="302" x2="286" y2="302" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>

  <text x="335" y="380" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">页面开着</text>
  <text x="335" y="393" text-anchor="middle" font-size="10" fill="#7f1d1d">= 连接常驻</text>
  <text x="335" y="406" text-anchor="middle" font-size="10" fill="#7f1d1d">= 会话被钉死</text>

  <!-- Server box -->
  <rect x="390" y="100" width="350" height="430" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="390" y="100" width="350" height="36" rx="10" fill="#0f172a"/>
  <rect x="390" y="118" width="350" height="18" fill="#0f172a"/>
  <text x="565" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Node 服务端（qf server）</text>

  <rect x="402" y="148" width="326" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="402" y="154" width="3" height="76" rx="1.5" fill="#dc2626"/>
  <text x="414" y="170" font-size="13" font-weight="700" fill="#b91c1c">会话永不逐出（被 SSE 钉死）</text>
  <text x="414" y="188" font-size="11" fill="#64748b">SSE keepalive 每 15s 调 touchSession，</text>
  <text x="414" y="203" font-size="11" fill="#64748b">10min idle 定时器永远被重置，</text>
  <text x="414" y="218" font-size="11" fill="#64748b">destroyAgent 永不触发（agentSessions 无上限）</text>

  <rect x="402" y="242" width="326" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="402" y="248" width="3" height="76" rx="1.5" fill="#dc2626"/>
  <text x="414" y="264" font-size="13" font-weight="700" fill="#b91c1c">完整历史驻留内存</text>
  <text x="414" y="282" font-size="11" fill="#64748b">agent.state.messages 只增不减；auto-compact</text>
  <text x="414" y="297" font-size="11" fill="#64748b">只压缩发给 LLM 的上下文切片，不释放内存；</text>
  <text x="414" y="312" font-size="11" fill="#64748b">subagent 全量转录还嵌入父会话 toolResult</text>

  <rect x="402" y="336" width="326" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="402" y="342" width="3" height="76" rx="1.5" fill="#dc2626"/>
  <text x="414" y="358" font-size="13" font-weight="700" fill="#b91c1c">SSE 写出无背压</text>
  <text x="414" y="376" font-size="11" fill="#64748b">res.write 不检查背压、无 socket 超时，半死</text>
  <text x="414" y="391" font-size="11" fill="#64748b">连接在 socket 写缓冲无限累积；每条事件经</text>
  <text x="414" y="406" font-size="11" fill="#64748b">JSON.stringify × 连接数重复序列化</text>

  <rect x="402" y="430" width="326" height="88" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="402" y="436" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="414" y="452" font-size="13" font-weight="700" fill="#b45309">ACP 会话永不逐出</text>
  <text x="414" y="470" font-size="11" fill="#64748b">idleRetention='always'（含 OpenCode 子进程），</text>
  <text x="414" y="485" font-size="11" fill="#64748b">客户端断开后不再重连即永久驻留，</text>
  <text x="414" y="500" font-size="11" fill="#64748b">重启 restore 后仍保持 always</text>

  <!-- Electron box -->
  <rect x="770" y="100" width="340" height="430" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <rect x="770" y="100" width="340" height="36" rx="10" fill="#78350f"/>
  <rect x="770" y="118" width="340" height="18" fill="#78350f"/>
  <text x="940" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Electron 桌面端（放大器）</text>

  <rect x="782" y="148" width="316" height="88" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <rect x="782" y="154" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="794" y="170" font-size="13" font-weight="700" fill="#b45309">关窗 = 隐藏到托盘</text>
  <text x="794" y="188" font-size="11" fill="#64748b">点 X 只 preventDefault + hide()，</text>
  <text x="794" y="203" font-size="11" fill="#64748b">renderer 进程与全部页面内存</text>
  <text x="794" y="218" font-size="11" fill="#64748b">永不释放，仅托盘 Quit 才退出</text>

  <rect x="782" y="242" width="316" height="88" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <rect x="782" y="248" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="794" y="264" font-size="13" font-weight="700" fill="#b45309">inline server 与主进程同一 V8 堆</text>
  <text x="794" y="282" font-size="11" fill="#64748b">默认内联模式把 server 加载进主进程，</text>
  <text x="794" y="297" font-size="11" fill="#64748b">服务端会话/消息泄漏与 renderer</text>
  <text x="794" y="312" font-size="11" fill="#64748b">页面内存叠加在同一个应用里</text>

  <rect x="782" y="336" width="316" height="88" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <rect x="782" y="342" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="794" y="358" font-size="13" font-weight="700" fill="#b45309">无堆上限设置</text>
  <text x="794" y="376" font-size="11" fill="#64748b">全仓库（desktop/bin/server/scripts）</text>
  <text x="794" y="391" font-size="11" fill="#64748b">均无 --max-old-space-size，</text>
  <text x="794" y="406" font-size="11" fill="#64748b">堆上限取 V8 默认（64 位约 4GB）</text>

  <rect x="782" y="430" width="316" height="88" rx="6" fill="#ffffff" stroke="#fde68a"/>
  <rect x="782" y="436" width="3" height="76" rx="1.5" fill="#d97706"/>
  <text x="794" y="452" font-size="13" font-weight="700" fill="#b45309">无监控 / 无看护</text>
  <text x="794" y="470" font-size="11" fill="#64748b">无 process.memoryUsage 埋点、无水位</text>
  <text x="794" y="485" font-size="11" fill="#64748b">告警；V8 OOM 不走 uncaughtException</text>
  <text x="794" y="500" font-size="11" fill="#64748b">通道，detached + stdio:ignore 静默死亡</text>

  <!-- Bottom causal chain -->
  <rect x="30" y="556" width="192" height="44" rx="22" fill="#e2e8f0"/>
  <text x="126" y="583" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">页面长期开着</text>
  <line x1="224" y1="578" x2="250" y2="578" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="252" y="556" width="192" height="44" rx="22" fill="#fde68a"/>
  <text x="348" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">SSE 常驻</text>
  <text x="348" y="592" text-anchor="middle" font-size="11" fill="#92400e">会话被钉死在内存</text>
  <line x1="446" y1="578" x2="472" y2="578" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="474" y="556" width="192" height="44" rx="22" fill="#fdba74"/>
  <text x="570" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">消息 / 事件</text>
  <text x="570" y="592" text-anchor="middle" font-size="11" fill="#7c2d12">无界累积（两端）</text>
  <line x1="668" y1="578" x2="694" y2="578" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="696" y="556" width="192" height="44" rx="22" fill="#f87171"/>
  <text x="792" y="576" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">V8 堆单调增长</text>
  <text x="792" y="592" text-anchor="middle" font-size="11" fill="#7f1d1d">compact 不回收内存</text>
  <line x1="890" y1="578" x2="916" y2="578" stroke="#7f1d1d" stroke-width="2" marker-end="url(#arrowDark)"/>

  <rect x="918" y="556" width="192" height="44" rx="22" fill="#7f1d1d"/>
  <text x="1014" y="583" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">OOM · 进程死亡</text>

  <text x="570" y="634" text-anchor="middle" font-size="11" fill="#475569">定位验证：renderer 侧用浏览器 DevTools → Memory 快照；server 侧 node --inspect 取 heap snapshot，看 agentSessions 与 socket 写缓冲的保留链占比</text>
  <text x="570" y="651" text-anchor="middle" font-size="11" fill="#475569">Electron 桌面端：主进程同时承载 inline server 与被托盘隐藏的 renderer，需同时观察应用整体内存</text>
</svg>
