<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuickForge · 对话轨迹（对话区内展开）交互原型</title>
<style>
  /* ==================================================================
   * 令牌全部对齐 src/index.css：颜色、字号、动效刻度与分割线配方。
   * 轨迹视图是对话区内部的一个视图（view），不是浮层、不是侧栏。
   * ================================================================== */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --workflow-done: oklch(0.55 0.13 158);
    --border: oklch(0.922 0 0);
    --sidebar-bg: #f3f4f6;

    --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC",
      sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
      "PingFang SC", "Microsoft YaHei", monospace;

    /* 主结构分割线统一配方 */
    --divider: color-mix(in oklab, var(--border) 60%, transparent);

    --dur-fast: 120ms;
    --dur-base: 180ms;
    --dur-slow: 280ms;
    --dur-exit: 140ms;
    --ease: cubic-bezier(0.2, 0, 0, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.5;
    color: var(--foreground); background: var(--sidebar-bg);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 4px; }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  svg.ico { width: 16px; height: 16px; flex: 0 0 auto; }

  /* ============================ 外壳 ============================ */
  .app { display: flex; height: 100%; }
  .sidebar {
    width: 244px; flex: 0 0 244px; display: flex; flex-direction: column; gap: 2px;
    padding: 10px 8px 56px; overflow: hidden;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 8px 12px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 7px; background: var(--primary);
    display: grid; place-items: center; color: var(--primary-foreground); font-size: 11px; font-weight: 700;
  }
  .brand-name { font-size: 13px; font-weight: 600; }
  .side-section { padding: 10px 8px 4px; font-size: 11px; color: var(--muted-foreground); }
  .side-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
    font-size: 13px; opacity: .82; text-align: left; width: 100%;
  }
  .side-item:hover { background: color-mix(in oklab, var(--border) 55%, transparent); opacity: 1; }
  .side-item.active { background: #d9dee7; opacity: 1; font-weight: 500; }
  .side-item.sub { padding-left: 26px; font-size: 12.5px; color: var(--muted-foreground); }
  .side-item .dotline { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .45; }

  .main {
    flex: 1; min-width: 0; display: flex; flex-direction: column;
    background: var(--background);
    border-left: 1px solid var(--divider);
    border-top: 1px solid var(--divider);
    border-top-left-radius: 16px;
    overflow: hidden;
  }

  /* ============================ 顶部栏 ============================ */
  .masthead {
    height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-bottom: 1px solid var(--divider);
  }
  .title-block { min-width: 0; flex: 1 1 auto; }
  .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
    border-radius: 999px; max-width: 200px; font-size: 13.5px; white-space: nowrap;
    transition: background var(--dur-fast) var(--ease);
  }
  .pill:hover { background: var(--muted); }
  .pill .ico { color: var(--muted-foreground); }
  .pill .label { overflow: hidden; text-overflow: ellipsis; }

  .icon-btn {
    width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center;
    transition: background var(--dur-fast) var(--ease);
  }
  .icon-btn:hover { background: var(--muted); }
  .icon-btn .ico { width: 18px; height: 18px; }
  .icon-btn.sm { width: 28px; height: 28px; }
  .icon-btn.sm .ico { width: 15px; height: 15px; }

  /* 视图切换：对话 / 轨迹（对齐 DSH 的 view 环页签） */
  .segmented {
    display: inline-flex; align-items: center; gap: 2px; padding: 3px;
    border-radius: 999px; background: color-mix(in oklab, var(--muted) 70%, transparent);
    flex: 0 0 auto;
  }
  .seg-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px;
    border-radius: 999px; font-size: 13px; color: var(--muted-foreground);
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .seg-btn:hover { color: var(--foreground); }
  .seg-btn .ico { width: 14px; height: 14px; }
  .seg-btn.on {
    background: var(--background); color: var(--foreground);
    box-shadow: 0 1px 2px hsl(0 0% 0% / .06);
  }
  .seg-btn .n {
    font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--muted-foreground);
    padding: 0 4px; border-radius: 999px; border: 1px solid var(--divider); min-width: 16px; text-align: center;
  }
  .live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--workflow-done); animation: breathe 1.6s ease-in-out infinite; }

  /* ============================ 视图容器 ============================ */
  .viewport { flex: 1; min-height: 0; display: flex; }
  .view { display: none; flex: 1; min-width: 0; flex-direction: column; min-height: 0; }
  .view.on { display: flex; animation: viewIn var(--dur-base) var(--ease); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view.on { animation: none; } }

  /* ============================ 对话视图 ============================ */
  .chat-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .chat-inner { max-width: 56rem; margin: 0 auto; padding: 26px 24px 120px; }
  .msg-user { display: flex; justify-content: flex-end; margin: 0 0 20px; }
  .user-bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 14px; background: var(--muted);
    border: 1px solid var(--divider); font-size: 13.5px; line-height: 1.6;
  }
  .assistant { margin: 0 0 24px; }
  .prose { margin: 0 0 11px; font-size: 13.5px; line-height: 1.68; }
  .prose code { font-family: var(--font-mono); font-size: .92em; background: var(--muted); padding: 1px 5px; border-radius: 5px; }
  .toolstack { display: flex; flex-direction: column; gap: 6px; margin: 9px 0 13px; }
  .tool-card {
    border: 1px solid var(--border); background: color-mix(in oklab, var(--card) 60%, var(--background));
    border-radius: 8px; padding: 9px 10px;
  }
  .tool-summary { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-size: 13px; color: var(--muted-foreground); min-width: 0; }
  .tool-summary .ico { width: 15px; height: 15px; }
  .ico.bad { color: var(--destructive); }
  .tool-summary .name { flex: 0 0 auto; color: var(--foreground); }
  .tool-summary .args {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--font-mono); font-size: 12px; opacity: .85;
  }
  .tool-summary .dur { flex: 0 0 auto; font-size: 11.5px; font-variant-numeric: tabular-nums; opacity: .8; }
  .jump-hint {
    display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted-foreground);
    opacity: 0; transition: opacity var(--dur-fast) var(--ease); margin-left: auto;
  }
  .tool-card:hover .jump-hint { opacity: 1; }
  .jump-hint .ico { width: 11px; height: 11px; }

  /* ============================ 轨迹视图 ============================ */
  .trace-toolbar {
    height: 44px; flex: 0 0 44px; display: flex; align-items: center; gap: 8px;
    padding: 0 12px; border-bottom: 1px solid var(--divider); min-width: 0;
  }
  .seg-mini {
    display: inline-flex; align-items: center; gap: 1px; padding: 2px;
    border-radius: 7px; border: 1px solid var(--divider); flex: 0 0 auto;
  }
  .seg-mini button {
    height: 24px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; color: var(--muted-foreground);
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); white-space: nowrap;
  }
  .seg-mini button:hover { color: var(--foreground); }
  .seg-mini button.on { background: var(--muted); color: var(--foreground); }

  .tool-btn {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
    border-radius: 6px; font-size: 11.5px; color: var(--muted-foreground);
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease); white-space: nowrap;
  }
  .tool-btn:hover { background: var(--muted); color: var(--foreground); }
  .tool-btn .ico { width: 13px; height: 13px; }

  .tb-spacer { flex: 1 1 auto; min-width: 8px; }

  .search-wrap {
    display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
    border-radius: 999px; border: 1px solid var(--divider); flex: 0 1 190px; min-width: 90px;
    transition: border-color var(--dur-fast) var(--ease);
  }
  .search-wrap:focus-within { border-color: color-mix(in oklab, var(--foreground) 20%, var(--border)); }
  .search-wrap .ico { width: 13px; height: 13px; color: var(--muted-foreground); }
  .search-wrap input {
    border: none; outline: none; background: none; width: 100%; min-width: 0;
    font-family: var(--font-sans); font-size: 12px; color: var(--foreground);
  }
  .search-wrap input::placeholder { color: var(--muted-foreground); }
  .search-count { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; flex: 0 0 auto; }

  /* ---------------------------- 时间总览 ---------------------------- */
  .timeline {
    flex: 0 0 auto; border-bottom: 1px solid var(--divider);
    padding: 8px 12px 4px; user-select: none;
  }
  .tl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .tl-title { font-size: 11px; color: var(--muted-foreground); letter-spacing: .02em; }
  .tl-span { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .tl-reset {
    margin-left: auto; display: none; align-items: center; gap: 4px; font-size: 11px;
    color: var(--muted-foreground); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--divider);
  }
  .tl-reset.show { display: inline-flex; }
  .tl-hint { font-size: 10.5px; color: var(--muted-foreground); opacity: .8; margin-left: 6px; }
  .tl-reset:hover { color: var(--foreground); background: var(--muted); }

  .tl-grid { position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 0 8px; }
  .tl-lanes { display: flex; flex-direction: column; gap: 3px; padding-bottom: 16px; }
  .lane-label {
    height: 16px; display: flex; align-items: center; font-size: 10px; color: var(--muted-foreground);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .tl-track { position: relative; padding-bottom: 16px; }
  .tl-lane {
    position: relative; height: 16px; margin-bottom: 3px; border-radius: 3px;
    background: color-mix(in oklab, var(--muted) 55%, transparent);
  }
  .tl-lane:last-child { margin-bottom: 0; }

  .tl-bar {
    position: absolute; top: 3px; height: 10px; border-radius: 2.5px; min-width: 3px;
    background: color-mix(in oklab, var(--foreground) 20%, transparent);
    transition: left var(--dur-base) var(--ease), width var(--dur-base) var(--ease), opacity var(--dur-fast) var(--ease);
    cursor: pointer;
  }
  .tl-bar.model { background: color-mix(in oklab, var(--foreground) 26%, transparent); }
  .tl-bar.tool { background: color-mix(in oklab, var(--foreground) 40%, transparent); }
  .tl-bar.tool.error { background: color-mix(in oklab, var(--destructive) 72%, transparent); }
  .tl-bar.tool.running {
    background: linear-gradient(90deg,
      color-mix(in oklab, var(--workflow-done) 30%, transparent),
      var(--workflow-done),
      color-mix(in oklab, var(--workflow-done) 30%, transparent));
    background-size: 200% 100%; animation: shimmer 2s ease-in-out infinite;
  }
  .tl-bar.compact {
    background: repeating-linear-gradient(135deg,
      color-mix(in oklab, var(--foreground) 22%, transparent) 0 3px,
      transparent 3px 6px);
  }
  .tl-bar.input { background: color-mix(in oklab, var(--foreground) 16%, transparent); top: 5px; height: 6px; }
  .tl-bar:hover { opacity: .72; }
  .tl-bar.dimmed { opacity: .18; }

  .tl-turn-line {
    position: absolute; top: 0; bottom: 16px; width: 1px; background: var(--divider);
    pointer-events: none;
  }
  .tl-turn-tag {
    position: absolute; bottom: 0; font-size: 9.5px; color: var(--muted-foreground);
    transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums;
    pointer-events: none;
  }

  .tl-selection {
    position: absolute; top: 0; bottom: 16px; background: color-mix(in oklab, var(--foreground) 7%, transparent);
    border-left: 1px solid color-mix(in oklab, var(--foreground) 22%, transparent);
    border-right: 1px solid color-mix(in oklab, var(--foreground) 22%, transparent);
    pointer-events: none; display: none; z-index: 2;
  }
  .tl-selection.show { display: block; }
  .tl-cursor {
    position: absolute; top: 0; bottom: 16px; width: 1px;
    background: color-mix(in oklab, var(--foreground) 30%, transparent);
    pointer-events: none; display: none; z-index: 3;
  }
  .tl-cursor.show { display: block; }

  .tl-tip {
    position: fixed; z-index: 50; padding: 5px 8px; border-radius: 6px;
    background: var(--popover, var(--background)); border: 1px solid var(--border);
    box-shadow: 0 4px 12px hsl(0 0% 0% / .10); font-size: 11px; line-height: 1.5;
    pointer-events: none; display: none; max-width: 240px;
  }
  .tl-tip.show { display: block; }
  .tl-tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tl-tip .muted { color: var(--muted-foreground); }

  /* ---------------------------- 主体两栏 ---------------------------- */
  .trace-body { flex: 1; min-height: 0; display: flex; }

  .ledger { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 6px 8px 80px; }

  .load-earlier {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin: 2px auto 8px; padding: 5px 12px; border-radius: 999px; font-size: 11.5px;
    color: var(--muted-foreground); border: 1px solid var(--divider);
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .load-earlier:hover { background: var(--muted); color: var(--foreground); }
  .load-earlier .ico { width: 12px; height: 12px; }

  .turn {
    border: 1px solid var(--divider); border-radius: 9px; margin-bottom: 8px; overflow: hidden;
  }
  .turn-head {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    padding: 7px 10px; background: color-mix(in oklab, var(--muted) 42%, transparent);
    font-size: 11.5px; color: var(--muted-foreground);
    transition: color var(--dur-fast) var(--ease);
  }
  .turn-head:hover { color: var(--foreground); }
  .turn-head .chev { transition: transform var(--dur-fast) var(--ease); width: 12px; height: 12px; }
  .turn-head.collapsed .chev { transform: rotate(-90deg); }
  .turn-head .idx { font-weight: 600; color: var(--foreground); font-size: 12px; }
  .turn-head .t { font-variant-numeric: tabular-nums; }
  .turn-head .stat { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .9; }
  .turn-body { padding: 4px 0 5px; }
  .turn-body.hidden { display: none; }

  /* Step 组：ASSISTANT 行 = 组头，工具行缩进 + 1px 弱连接线（对齐 DESIGN_LANGUAGE
     「对话折叠的阶段内子级用缩进 + 细连接线」的例外条款） */
  .step-group { position: relative; margin: 0 0 1px; }
  .step-row-wrap { display: flex; align-items: center; min-width: 0; }
  .step-chev {
    width: 18px; flex: 0 0 18px; height: 22px; display: grid; place-items: center;
    margin-left: 2px; border-radius: 4px; color: var(--muted-foreground);
    transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .step-chev:hover { background: var(--muted); color: var(--foreground); }
  .step-chev .chev { width: 11px; height: 11px; transition: transform var(--dur-fast) var(--ease); }
  .step-chev.collapsed .chev { transform: rotate(-90deg); }
  .step-row-wrap .row { flex: 1 1 auto; min-width: 0; padding-left: 0; }
  .step-row-wrap .row .bar-dot { margin-left: 0; }

  .tool-rows { position: relative; padding-left: 26px; }
  .tool-rows.hidden { display: none; }
  .tool-rows::before {
    content: ''; position: absolute; left: 12px; top: 0; bottom: 5px; width: 1px;
    background: var(--divider);
  }
  .tool-rows .row { padding-left: 8px; }
  .tool-rows .row .bar-dot { margin-left: -8px; }

  .row {
    display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
    padding: 5px 10px 5px 22px; border-radius: 6px; min-width: 0;
    transition: background var(--dur-fast) var(--ease);
  }
  .row:hover { background: color-mix(in oklab, var(--muted) 62%, transparent); }
  .row.selected { background: var(--muted); }
  .row.dimmed { opacity: .34; }
  .row .bar-dot {
    width: 2px; height: 15px; border-radius: 2px; flex: 0 0 2px;
    background: color-mix(in oklab, var(--foreground) 18%, transparent); margin-left: -8px;
  }
  .row[data-status="error"] .bar-dot { background: color-mix(in oklab, var(--destructive) 70%, transparent); }
  .row[data-status="running"] .bar-dot { background: var(--workflow-done); animation: breathe 1.6s ease-in-out infinite; }
  .badge {
    font-size: 9.5px; letter-spacing: .05em; padding: 0 4px; border-radius: 3px;
    border: 1px solid var(--divider); color: var(--muted-foreground); flex: 0 0 auto;
    line-height: 15px; text-transform: uppercase; font-weight: 500;
  }
  .badge.user { color: color-mix(in oklab, var(--foreground) 70%, transparent); }
  .badge.tool { color: color-mix(in oklab, var(--foreground) 78%, transparent); }
  .badge.compact { color: color-mix(in oklab, var(--foreground) 55%, transparent); }
  .row[data-status="error"] .badge { color: var(--destructive); border-color: color-mix(in oklab, var(--destructive) 34%, transparent); }
  .row .ico { width: 13px; height: 13px; color: var(--muted-foreground); flex: 0 0 auto; }
  .row[data-status="error"] .ico { color: var(--destructive); }
  .row .name { font-size: 12.5px; flex: 0 0 auto; }
  .row .args {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground);
  }
  .row .text {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--muted-foreground);
  }
  .row .par {
    font-size: 9px; padding: 0 3px; border-radius: 3px; border: 1px solid var(--divider);
    color: var(--muted-foreground); line-height: 14px; flex: 0 0 auto;
  }
  .row .dur { flex: 0 0 auto; font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .row[data-status="error"] .dur { color: var(--destructive); }
  .row .tok { flex: 0 0 auto; font-size: 10.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; opacity: .8; }

  .run-shimmer {
    background: linear-gradient(90deg,
      color-mix(in oklab, var(--foreground) 55%, transparent) 0%,
      var(--foreground) 42%,
      color-mix(in oklab, var(--foreground) 55%, transparent) 62%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: shimmer 2s ease-in-out infinite;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.86); } 50% { opacity: 1; transform: scale(1); } }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .run-shimmer { animation: none; -webkit-text-fill-color: currentColor; color: var(--foreground); background: none; }
    .live-dot, .row[data-status="running"] .bar-dot, .tl-bar.tool.running { animation: none; }
    .spin { animation: none; }
    .tl-bar { transition: none; }
  }

  /* ---------------------------- Inspector ---------------------------- */
  .inspector {

  loader: '<path d="M21 12a9 9 0 1 1-6.2-8.6"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  expand: '<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',
  collapse: '<path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/>'
}
function svg(name, cls) {
  return '<svg class="ico ' + (cls || '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.activity) + '</svg>'
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}
function fmtDur(ms) {
  if (ms == null) return '—'
  if (ms < 1000) return Math.round(ms) + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's'
  const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000)
  return m + 'm ' + String(s).padStart(2, '0') + 's'
}
function fmtSpan(ms) {
  if (ms < 1000) return Math.round(ms) + 'ms'
  if (ms < 60000) return (ms / 1000).toFixed(1) + ' 秒'
  const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000)
  return m + ' 分 ' + String(s).padStart(2, '0') + ' 秒'
}
function fmtClock(ts) {
  const d = new Date(ts), p = (n) => String(n).padStart(2, '0')
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds())
}
function fmtTok(n) {
  if (n == null) return '—'
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n)
}
function now() { return Date.now() }

/* ============================ 模型 ============================ */
function buildModel() {
  if (state.demo === 'empty') {
    return { turns: EMPTY.map(cloneTurn), runningId: null, hasTools: false }
  }
  let runningId = null
  const turns = BASE.map((t) => {
    const turn = cloneTurn(t)
    for (const step of turn.steps) {
      for (const tool of step.tools) {
        if (tool.status === 'running') {
          if (state.demo === 'done') { tool.status = 'ok'; tool.durationMs = 12400 }
          else { runningId = tool.id; tool.at = RUNNING_START }
        }
      }
    }
    const endCandidates = []
    if (turn.steps.length) endCandidates.push(turn.steps[turn.steps.length - 1].at + (turn.steps[turn.steps.length - 1].durationMs || 0))
    for (const step of turn.steps) for (const tool of step.tools) {
      endCandidates.push(tool.at + (tool.durationMs || (tool.status === 'running' ? now() - tool.at : 0)))
    }
    turn.endAt = Math.max(...endCandidates, turn.startAt + 1000)
    return turn
  })
  const hasTools = turns.some((t) => t.steps.some((s) => s.tools.length))
  // Between turns：上下文压缩（真实存在的能力，放在独立区段）
  const between = state.demo === 'done' || state.demo === 'running'
    ? [{ kind: 'compact', id: 'cp1', at: T0 + 129000, durationMs: 2600, label: '上下文压缩', note: '12 条消息 → 摘要，保留 8 条' }]
    : []
  return { turns, between, runningId, hasTools }
}
function cloneTurn(t) {
  return {
    index: t.index, startAt: t.startAt, user: t.user, outro: t.outro || '',
    steps: t.steps.map((s) => ({ ...s, tools: s.tools.map((c) => ({ ...c })) }))
  }
}
function toolElapsed(tool) {
  if (tool.status === 'running') return Math.max(0, now() - tool.at)
  return tool.durationMs || 0
}

/* ============================ 扁平记录 ============================ */
function flatRecords(model) {
  const list = []
  for (const turn of model.turns) {
    list.push({ kind: 'user', id: 'u' + turn.index, turnIndex: turn.index, at: turn.startAt, endAt: turn.startAt, text: turn.user })
    for (const step of turn.steps) {
      list.push({
        kind: 'step', id: step.id, turnIndex: turn.index, at: step.at,
        endAt: step.at + (step.durationMs || 0), step, text: step.text
      })
      for (const tool of step.tools) {
        list.push({
          kind: 'tool', id: tool.id, turnIndex: turn.index, at: tool.at,
          endAt: tool.at + toolElapsed(tool), tool, stepId: step.id
        })
      }
    }
  }
  for (const b of model.between || []) {
    list.push({ kind: 'compact', id: b.id, turnIndex: null, at: b.at, endAt: b.at + b.durationMs, compact: b, text: b.note })
  }
  return list.sort((a, b) => a.at - b.at)
}

/* 时间轴布局：三种模式 */
function computeBounds(model) {
  const all = flatRecords(model)
  if (!all.length) return null
  const starts = all.map((r) => r.at)
  const ends = all.map((r) => r.endAt || r.at)
  const min = Math.min(...starts)
  const max = Math.max(...ends)
  return { min, max, span: Math.max(max - min, 1), records: all }
}
function layoutBars(model, bounds) {
  /* 返回 id -> {leftPct, widthPct} */
  const out = {}
  if (!bounds) return out

  if (state.mode === 'time') {
    for (const r of bounds.records) {
      const left = ((r.at - bounds.min) / bounds.span) * 100
      const w = Math.max(((r.endAt - r.at) / bounds.span) * 100, 0.9)
      out[r.id] = { left: clamp(left, 0, 99.1), width: Math.min(w, 100 - left) }
    }
    return out
  }

  if (state.mode === 'duration') {
    /* 每轨独立：按该轨内记录的实际耗时分配宽度 */
    const laneOf = (r) => (r.kind === 'user' ? 'input' : r.kind === 'tool' ? 'tools' : 'model')
    const lanes = { input: [], model: [], tools: [] }
    for (const r of bounds.records) lanes[laneOf(r)].push(r)
    for (const key of Object.keys(lanes)) {
      const items = lanes[key]
      const totalDur = items.reduce((sum, r) => sum + Math.max(r.endAt - r.at, 1), 0) || 1
      let cursor = 0
      for (const r of items) {
        const w = (Math.max(r.endAt - r.at, 1) / totalDur) * 100
        out[r.id] = { left: cursor, width: Math.max(w, 0.9) }
        cursor += w
      }
    }
    return out
  }

  /* sequence：所有记录按时间排序后等宽串行 */
  const items = bounds.records
  const n = items.length || 1
  items.forEach((r, i) => {
    const w = 100 / n
    out[r.id] = { left: i * w, width: Math.max(w, 0.9) }
  })
  return out
}
function clamp(v, a, b) { return Math.min(Math.max(v, a), b) }

/* ============================ 对话视图 ============================ */
function renderChat(model) {
  const html = model.turns.map((turn) => {
    const stepBlocks = turn.steps.map((step) => {
      const cards = step.tools.map((tool) => {
        const running = tool.status === 'running'
        const dur = toolElapsed(tool)
        return '<div class="tool-card" data-jump="' + tool.id + '">' +
            '<button class="tool-summary" type="button" data-open-tool="' + tool.id + '">' +
              (running
                ? '<svg class="ico spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>'
                : svg(tool.name, tool.status === 'error' ? 'bad' : '')) +
              '<span class="name ' + (running ? 'run-shimmer' : '') + '">' + esc(tool.name) + '</span>' +
              '<span class="args">' + esc(tool.args) + '</span>' +
              '<span class="dur">' + (running ? '+' + fmtDur(dur) : fmtDur(dur)) + '</span>' +
              '<span class="jump-hint">' + svg('panel') + '在轨迹中查看</span>' +
            '</button>' +
          '</div>'
      }).join('')
      return '<p class="prose">' + inlineCode(step.text) + '</p>' +
        (cards ? '<div class="toolstack">' + cards + '</div>' : '')
    }).join('')
    return '<div class="msg-user"><div class="user-bubble">' + esc(turn.user) + '</div></div>' +
      '<div class="assistant">' + stepBlocks +
      (turn.outro ? '<p class="prose">' + inlineCode(turn.outro) + '</p>' : '') + '</div>'
  }).join('')
  document.getElementById('chatInner').innerHTML = html
}
function inlineCode(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>')
}

/* ============================ 轨迹：时间总览 ============================ */
function renderTimeline(model) {
  document.getElementById('timeline').style.display = model.hasTools ? '' : 'none'
  const bounds = computeBounds(model)
  const lanes = { input: document.getElementById('laneInput'), model: document.getElementById('laneModel'), tools: document.getElementById('laneTools') }
  const track = document.getElementById('tlTrack')
  track.querySelectorAll('.tl-turn-line,.tl-turn-tag').forEach((n) => n.remove())

  if (!bounds || !bounds.records.length) {
    Object.values(lanes).forEach((l) => { l.innerHTML = '' })
    document.getElementById('tlSpan').textContent = ''
    return
  }

  /* Turn 分隔线（三种模式下都按比例落位） */

  if (state.mode === 'time') {
    for (const turn of model.turns) {
      const left = ((turn.startAt - bounds.min) / bounds.span) * 100
      const line = document.createElement('div')
      line.className = 'tl-turn-line'
      line.style.left = clamp(left, 0, 100) + '%'
      track.appendChild(line)
      const tag = document.createElement('div')
      tag.className = 'tl-turn-tag'
      tag.style.left = clamp(left, 3, 97) + '%'
      tag.textContent = 'T' + turn.index
      track.appendChild(tag)
    }
  } else {
    /* 等宽/耗时模式：Turn 标签按该轮内记录占位比例落在轨道顶部 */
    const all = bounds.records
    const n = all.length
    model.turns.forEach((turn) => {
      const idx = all.findIndex((r) => r.turnIndex === turn.index)
      if (idx < 0) return
      const pct = state.mode === 'sequence' ? (idx / n) * 100 : null
      if (pct == null) return
      const tag = document.createElement('div')
      tag.className = 'tl-turn-tag'
      tag.style.left = clamp(pct, 3, 97) + '%'
      tag.textContent = 'T' + turn.index
      track.appendChild(tag)
    })
  }

  const layout = layoutBars(model, bounds)
  lanes.input.innerHTML = ''
  lanes.model.innerHTML = ''
  lanes.tools.innerHTML = ''

  const sel = state.selection
  for (const r of bounds.records) {
    const pos = layout[r.id]
    if (!pos) continue
    const bar = document.createElement('div')
    bar.className = 'tl-bar ' + (r.kind === 'user' ? 'input' : r.kind === 'tool' ? 'tool' : r.kind === 'compact' ? 'compact' : 'model')
    if (r.kind === 'tool') {
      if (r.tool.status === 'error') bar.classList.add('error')
      if (r.tool.status === 'running') bar.classList.add('running')
    }
    if (sel && (r.endAt < sel.start || r.at > sel.end)) bar.classList.add('dimmed')
    if (state.selected === r.id) bar.style.opacity = '1'
    bar.style.left = pos.left + '%'
    bar.style.width = pos.width + '%'
    bar.dataset.id = r.id
    bar.dataset.kind = r.kind

    const lane = r.kind === 'user' ? lanes.input : r.kind === 'tool' ? lanes.tools : lanes.model
    lane.appendChild(bar)
  }

  document.getElementById('tlSpan').textContent = fmtClock(bounds.min) + ' – ' + fmtClock(bounds.max) + ' · ' + fmtSpan(bounds.span)
  document.getElementById('tlHint').textContent = state.mode === 'time'
    ? '拖选可筛区间 · 右键清除'
    : (state.mode === 'duration' ? '按耗时分配宽度' : '等宽串行，便于看顺序')
}

/* 时间轴交互：hover tooltip + 拖选 + 右键清除 */
function initTimeline() {
  const track = document.getElementById('tlTrack')
  const selection = document.getElementById('tlSelection')
  const cursorEl = document.getElementById('tlCursor')
  const tip = document.getElementById('tlTip')
  let dragging = false
  let dragStartX = 0

  function pctFromEvent(e) {
    const rect = track.getBoundingClientRect()
    return clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100)
  }
  function timeFromPct(pct, bounds) {
    return bounds.min + (pct / 100) * bounds.span
  }

  track.addEventListener('mousemove', (e) => {
    const model = buildModel()
    const bounds = computeBounds(model)
    if (!bounds) return
    const pct = pctFromEvent(e)
    cursorEl.classList.add('show')
    cursorEl.style.left = pct + '%'
    if (dragging) {
      const a = Math.min(dragStartX, pct), b = Math.max(dragStartX, pct)
      selection.classList.add('show')
      selection.style.left = a + '%'
      selection.style.width = (b - a) + '%'
    }

    const bar = e.target.closest('.tl-bar')
    if (bar) {
      const rec = bounds.records.find((r) => r.id === bar.dataset.id)
      if (rec) {
        const dur = rec.endAt - rec.at
        const running = rec.kind === 'tool' && rec.tool.status === 'running'
        tip.innerHTML =
          '<b>' + esc(recTitle(rec)) + '</b>' +
          (running ? ' <span class="muted">运行中</span>' : '') +
          '<br><span class="muted">' + fmtClock(rec.at) + ' → ' + (running ? '…' : fmtClock(rec.endAt)) + '</span>' +
          ' · <b>' + fmtDur(dur) + '</b>' +
          (rec.kind === 'step' ? '<br><span class="muted">' + fmtTok(rec.step.inTok) + ' in / ' + fmtTok(rec.step.outTok) + ' out</span>' : '') +
          (rec.kind === 'tool' && rec.tool.status === 'error' ? '<br><span class="muted">失败</span>' : '')
        tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 260) + 'px'
        tip.style.top = (e.clientY + 16) + 'px'
        tip.classList.add('show')
      }
    } else {
      tip.classList.remove('show')
    }
  })

  track.addEventListener('mouseleave', () => {
    tip.classList.remove('show')
    cursorEl.classList.remove('show')
    if (!dragging) return
    dragging = false
  })

  track.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return
    if (state.mode !== 'time') return   // 只有「时钟」模式的横向位置才等于真实时间
    dragging = true
    dragStartX = pctFromEvent(e)
    selection.classList.add('show')
    selection.style.left = dragStartX + '%'
    selection.style.width = '0%'
    e.preventDefault()
  })

  window.addEventListener('mouseup', (e) => {
    if (!dragging) return
    dragging = false
    const pct = pctFromEvent(e)
    const a = Math.min(dragStartX, pct), b = Math.max(dragStartX, pct)
    const model = buildModel()
    const bounds = computeBounds(model)
    if (!bounds) return
    if (b - a < 1.5) {
      /* 视为点击：清除选择 */
      state.selection = null
      selection.classList.remove('show')
    } else {
      state.selection = { start: timeFromPct(a, bounds), end: timeFromPct(b, bounds) }
      selection.classList.add('show')
      selection.style.left = a + '%'
      selection.style.width = (b - a) + '%'
    }
    renderTimeline(model)
    renderLedger(model)
    updateResetButton()
  })

  track.addEventListener('contextmenu', (e) => {
    e.preventDefault()
    clearSelection()
  })

  track.addEventListener('click', (e) => {
    const bar = e.target.closest('.tl-bar')
    if (!bar) return
    const model = buildModel()
    selectRecord(bar.dataset.id, model, { scrollLedger: true })
  })
}

function updateResetButton() {
  const btn = document.getElementById('tlReset')
  btn.classList.toggle('show', !!state.selection)
  if (state.selection) {
    btn.innerHTML = svg('x') + ' 清除 ' + fmtClock(state.selection.start) + '–' + fmtClock(state.selection.end)
  }
}
function clearSelection() {
  state.selection = null
  document.getElementById('tlSelection').classList.remove('show')
  const model = buildModel()
  renderTimeline(model)
  renderLedger(model)
  updateResetButton()
}

/* ============================ 轨迹：Ledger ============================ */
function recTitle(rec) {
  if (rec.kind === 'user') return 'USER'
  if (rec.kind === 'step') return 'ASSISTANT · ' + rec.step.model
  if (rec.kind === 'tool') return rec.tool.name
  if (rec.kind === 'compact') return 'COMPACTED'
  return rec.kind
}

function matchRecord(rec, q) {
  if (!q) return true
  const t = q.toLowerCase()
  if (rec.kind === 'user') return rec.text.toLowerCase().includes(t)
  if (rec.kind === 'step') return (rec.step.text + ' ' + rec.step.model).toLowerCase().includes(t)
  if (rec.kind === 'tool') return (rec.tool.name + ' ' + rec.tool.args + ' ' + rec.tool.output).toLowerCase().includes(t)
  if (rec.kind === 'compact') return 'compact 压缩'.includes(t)
  return false
}
function inSelection(rec) {
  if (!state.selection) return true
  return !(rec.endAt < state.selection.start || rec.at > state.selection.end)
}

function renderLedger(model) {
  const ledger = document.getElementById('ledger')
  const q = state.query.trim()

  if (!model.hasTools) {
    ledger.innerHTML =
      '<div class="trace-empty">' + svg('activity') +
        '<div class="t1">这个会话还没有可展示的运行记录</div>' +
        '<div class="t2">Agent 开始调用工具后，这里会按轮次显示每次模型请求、<br>工具调用、耗时与 token 用量。</div>' +
      '</div>'
    document.getElementById('traceCount').textContent = '0'
    return
  }

  let total = 0
  const turnsHtml = model.turns.map((turn) => {
    const recs = []
    if (inSelection({ at: turn.startAt, endAt: turn.endAt })) {
      // 判断该轮是否有任何记录落在选择区间
      const micro = flatRecords({ turns: [turn], between: [] })
      if (!micro.some(inSelection)) return ''
    }
    recs.push({ kind: 'user', id: 'u' + turn.index, at: turn.startAt, endAt: turn.startAt, text: turn.user, turnIndex: turn.index })
    for (const step of turn.steps) {
      recs.push({ kind: 'step', id: step.id, at: step.at, endAt: step.at + (step.durationMs || 0), step, turnIndex: turn.index })
      for (const tool of step.tools) {
        recs.push({ kind: 'tool', id: tool.id, at: tool.at, endAt: tool.at + toolElapsed(tool), tool, stepId: step.id, turnIndex: turn.index })
      }
    }
    const shown = recs.filter((r) => inSelection(r))
    if (!shown.length) return ''
    total += shown.filter((r) => r.kind === 'tool').length

    const dimmedIds = new Set()
    if (q) for (const r of shown) if (!matchRecord(r, q)) dimmedIds.add(r.id)

    const collapsed = state.collapsedTurns.has(turn.index)
    const toolCount = recs.filter((r) => r.kind === 'tool').length
    const stepCount = recs.filter((r) => r.kind === 'step').length

    let body = ''
    body += rowHtml(shown.find((r) => r.kind === 'user'), dimmedIds)
    for (const step of turn.steps) {
      const stepRec = shown.find((r) => r.kind === 'step' && r.id === step.id)
      const toolRecs = shown.filter((r) => r.kind === 'tool' && r.stepId === step.id)
      if (!stepRec && !toolRecs.length) continue
      const stepCollapsed = state.collapsedSteps.has(step.id)
      const stepTools = step.tools
      const stepDim = dimmedIds.has(step.id) && stepTools.every((c) => dimmedIds.has(c.id))
      body +=
        '<div class="step-group">' +
          // ASSISTANT 行即 step 组头：点整行选中，点左侧 chevron 折叠工具行
          '<div class="step-row-wrap">' +
            '<button class="step-chev ' + (stepCollapsed ? 'collapsed' : '') + '" type="button" data-step="' + step.id + '" aria-label="折叠本步骤工具调用" aria-expanded="' + String(!stepCollapsed) + '">' +
              svg('chevronDown', 'chev') +
            '</button>' +
            rowHtml(stepRec || { kind: 'step', id: step.id, at: step.at, endAt: step.at + (step.durationMs || 0), step, turnIndex: turn.index }, dimmedIds, stepDim) +
          '</div>' +
          (toolRecs.length
            ? '<div class="tool-rows ' + (stepCollapsed ? 'hidden' : '') + '">' +
                toolRecs.map((r) => rowHtml(r, dimmedIds)).join('') +
              '</div>'
            : '') +
        '</div>'
    }

    return '<div class="turn">' +
      '<button class="turn-head ' + (collapsed ? 'collapsed' : '') + '" type="button" data-turn="' + turn.index + '">' +
        svg('chevronDown', 'chev') +
        '<span class="idx">Turn ' + turn.index + '</span>' +
        '<span class="t">' + fmtClock(turn.startAt) + '</span>' +
        '<span class="stat">' + stepCount + ' 个步骤 · ' + toolCount + ' 个工具调用 · ' + fmtDur(turn.endAt - turn.startAt) + '</span>' +
      '</button>' +
      '<div class="turn-body ' + (collapsed ? 'hidden' : '') + '">' + body + '</div>' +
    '</div>'
  }).join('')

  /* Between turns（压缩）区段 */
  let betweenHtml = ''
  const betweenRecs = (model.between || []).filter((b) => inSelection({ at: b.at, endAt: b.at + b.durationMs }))
  if (betweenRecs.length && !state.collapsedTurns.has('between')) {
    betweenHtml =
      '<div class="turn">' +
        '<button class="turn-head" type="button" data-turn="between">' +
          svg('chevronDown', 'chev') +
          '<span class="idx">Between turns</span>' +
          '<span class="t">' + betweenRecs.length + ' 次上下文压缩</span>' +
        '</button>' +
        '<div class="turn-body">' +
          betweenRecs.map((b) => rowHtml({ kind: 'compact', id: b.id, at: b.at, endAt: b.at + b.durationMs, compact: b, text: b.note }, new Set())).join('') +
        '</div>' +
      '</div>'
  }

  const hasAny = turnsHtml.replace(/\s/g, '').length > 0 || betweenHtml.length > 0
  ledger.innerHTML =
    '<button class="load-earlier" type="button" id="loadEarlier">' + svg('arrowUp') + '加载更早的历史（按轮次分页）</button>' +
    (hasAny ? turnsHtml + betweenHtml : '<div class="trace-empty">' + svg('search') + '<div class="t1">没有匹配的记录</div><div class="t2">' +
      (state.selection ? '当前时间区间内没有活动，清除筛选可看全部。' : '换个关键词试试。') + '</div></div>')

  document.getElementById('traceCount').textContent = String(total)
  document.getElementById('searchCount').textContent = q ? countMatches(model, q) + ' 处匹配' : ''
}

function countMatches(model, q) {
  let n = 0
  for (const turn of model.turns) {
    if (matchRecord({ kind: 'user', text: turn.user }, q)) n++
    for (const step of turn.steps) {
      if (matchRecord({ kind: 'step', step }, q)) n++
      for (const tool of step.tools) if (matchRecord({ kind: 'tool', tool }, q)) n++
    }
  }
  return n
}

function rowHtml(rec, dimmedIds, stepDim) {
  if (!rec) return ''
  const dim = (stepDim || dimmedIds.has(rec.id)) ? ' dimmed' : ''
  const selected = state.selected === rec.id ? ' selected' : ''
  if (rec.kind === 'user') {
    return '<button class="row' + dim + selected + '" type="button" data-rec="' + rec.id + '">' +
      '<span class="bar-dot"></span>' +
      '<span class="badge user">USER</span>' +
      svg('user') +
      '<span class="text">' + esc(rec.text) + '</span>' +
      '<span class="dur">' + fmtClock(rec.at) + '</span>' +
    '</button>'
  }
  if (rec.kind === 'compact') {
    return '<button class="row' + dim + selected + '" type="button" data-rec="' + rec.id + '">' +
      '<span class="bar-dot"></span>' +
      '<span class="badge compact">COMPACT</span>' +
      svg('compact') +
      '<span class="name">' + esc(rec.compact.label) + '</span>' +
      '<span class="args">' + esc(rec.compact.note) + '</span>' +
      '<span class="dur">' + fmtDur(rec.compact.durationMs) + '</span>' +
    '</button>'
  }
  if (rec.kind === 'step') {
    const st = rec.step
    return '<button class="row step-row' + dim + selected + '" type="button" data-rec="' + rec.id + '" data-status="ok">' +
      '<span class="bar-dot"></span>' +
      '<span class="badge">ASSISTANT</span>' +
      '<span class="name">' + esc(st.model) + '</span>' +
      '<span class="text">' + esc(st.text) + '</span>' +
      '<span class="tok">' + fmtTok(st.inTok) + '→' + fmtTok(st.outTok) + '</span>' +
      '<span class="dur">' + fmtDur(st.durationMs) + '</span>' +
    '</button>'
  }
  const tool = rec.tool
  const running = tool.status === 'running'
  const dur = toolElapsed(tool)
  return '<button class="row tool-row' + dim + selected + '" type="button" data-rec="' + rec.id + '" data-status="' + tool.status + '">' +
    '<span class="bar-dot"></span>' +
    '<span class="badge tool">TOOL</span>' +
    (running
      ? '<svg class="ico spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>'
      : svg(tool.name)) +
    '<span class="name ' + (running ? 'run-shimmer' : '') + '">' + esc(tool.name) + '</span>' +
    (tool.parallel ? '<span class="par">并行</span>' : '') +
    '<span class="args">' + esc(tool.args) + '</span>' +
    '<span class="dur">' + (running ? '+' + fmtDur(dur) : fmtDur(dur)) + '</span>' +
  '</button>'
}

/* ============================ Inspector ============================ */
const TABSET = {
  user: ['summary', 'raw'],
  step: ['summary', 'output', 'usage', 'raw'],
  tool: ['summary', 'args', 'result', 'timing'],
  compact: ['summary']
}
const TAB_LABEL = {
  summary: 'Summary', output: 'Output', usage: 'Usage', raw: 'Raw',
  args: 'Args', result: 'Result', timing: 'Timing'
}

function findRecord(model, id) {
  return flatRecords(model).find((r) => r.id === id) || null
}

function selectRecord(id, model, opts) {
  const rec = findRecord(model, id)
  if (!rec) return
  if (rec.turnIndex != null) state.collapsedTurns.delete(rec.turnIndex)
  state.selected = id
  state.tab = 'summary'
  if (rec.kind === 'tool' && rec.stepId) state.collapsedSteps.delete(rec.stepId)
  renderInspector(rec)
  renderLedger(model)
  renderTimeline(model)
  document.getElementById('inspector').classList.remove('hidden')
  if (opts && opts.scrollLedger) {
    const row = document.querySelector('[data-rec="' + id + '"]')
    if (row) {
      const body = row.closest('.tool-rows.hidden, .turn-body.hidden')
      if (body && body.classList.contains('hidden')) body.classList.remove('hidden')
      row.scrollIntoView({ behavior: 'smooth', block: 'center' })
    }
  }
}

function renderInspector(rec) {
  if (!rec) {
    document.getElementById('inspector').classList.add('hidden')
    return
  }
  const iconName = rec.kind === 'tool' ? rec.tool.name : rec.kind === 'user' ? 'user' : rec.kind === 'compact' ? 'compact' : 'step'
  document.getElementById('insIcon').innerHTML = svg(iconName)
  document.getElementById('insTitle').textContent = recTitle(rec)

  const tabs = TABSET[rec.kind] || ['summary']
  document.getElementById('insTabs').innerHTML = tabs.map((t) =>
    '<button class="ins-tab ' + (state.tab === t ? 'on' : '') + '" type="button" data-tab="' + t + '">' + TAB_LABEL[t] + '</button>'
  ).join('')

  const body = document.getElementById('insBody')
  if (rec.kind === 'tool') body.innerHTML = toolInspector(rec, state.tab)
  else if (rec.kind === 'step') body.innerHTML = stepInspector(rec, state.tab)
  else if (rec.kind === 'user') body.innerHTML = userInspector(rec, state.tab)
  else body.innerHTML = compactInspector(rec)
}

function metaRow(dt, dd, cls) {
  return '<dt>' + esc(dt) + '</dt><dd' + (cls ? ' class="' + cls + '"' : '') + '>' + dd + '</dd>'
}
function toolInspector(rec, tab) {
  const t = rec.tool
  const running = t.status === 'running'
  const dur = toolElapsed(t)
  const statusText = t.status === 'error' ? '失败' : running ? '运行中' : '成功'
  const statusCls = t.status === 'error' ? 'bad' : running ? '' : 'ok'

  if (tab === 'summary') {
    return '<dl class="ins-meta">' +
      metaRow('状态', statusText, statusCls) +
      metaRow('耗时', fmtDur(dur)) +
      metaRow('开始', fmtClock(t.at)) +
      metaRow('结束', running ? '— （进行中，不虚构）' : fmtClock(t.at + t.durationMs)) +
      metaRow('所在步骤', esc(rec.stepId || '—')) +
      (t.parallel ? metaRow('并行组', esc(t.parallel)) : '') +
      metaRow('调用 ID', '<code>' + esc(rec.id) + '</code>') +
    '</dl>' +
    '<div class="ins-section"><div class="ins-label">参数摘要</div><pre>' + esc(t.args) + '</pre></div>' +
    '<div class="ins-actions">' +
      '<button type="button" data-ins-action="copy-id">' + svg('copy') + '复制调用 ID</button>' +
      '<button type="button" data-ins-action="goto-chat">' + svg('chat') + '在对话中定位</button>' +
    '</div>'
  }
  if (tab === 'args') {
    return '<div class="ins-section"><div class="ins-label">输入 JSON</div><pre>' + esc(t.input) + '</pre></div>' +
      '<div class="ins-actions"><button type="button" data-ins-action="copy-args">' + svg('copy') + '复制参数</button></div>'
  }
  if (tab === 'result') {
    return '<div class="ins-section"><div class="ins-label">' + (t.status === 'error' ? '错误输出' : '输出') + '</div>' +
      '<pre' + (t.status === 'error' ? ' class="bad"' : '') + '>' + esc(t.output) + '</pre></div>' +
      '<div class="ins-actions"><button type="button" data-ins-action="copy-result">' + svg('copy') + '复制输出</button></div>'
  }
  /* timing */
  return '<dl class="ins-meta">' +
    metaRow('startedAt', t.at + ' <span style="color:var(--muted-foreground)">(' + fmtClock(t.at) + ')</span>') +
    metaRow('finishedAt', running ? '—' : (t.at + t.durationMs) + ' <span style="color:var(--muted-foreground)">(' + fmtClock(t.at + t.durationMs) + ')</span>') +
    metaRow('durationMs', running ? '—' : String(t.durationMs)) +
    metaRow('数据来源', '<code>details.quickforgeTiming</code>') +
    metaRow('持久化', '是（session_messages 不裁剪 details）') +
  '</dl>' +
  '<div class="ins-section"><div class="ins-label">原始 details</div><pre>' +
    esc(JSON.stringify({ quickforgeTiming: { startedAt: t.at, finishedAt: running ? undefined : t.at + t.durationMs, durationMs: running ? undefined : t.durationMs } }, null, 2)) +
  '</pre></div>'
}
function stepInspector(rec, tab) {
  const s = rec.step
  if (tab === 'summary') {
    return '<dl class="ins-meta">' +
      metaRow('模型', esc(s.model)) +
      metaRow('耗时', fmtDur(s.durationMs)) +
      metaRow('开始', fmtClock(s.at)) +
      metaRow('结束', fmtClock(s.at + s.durationMs)) +
      metaRow('工具数', String(s.tools.length)) +
      metaRow('请求 ID', '<code>' + esc(s.id) + '</code>') +
    '</dl>'
  }
  if (tab === 'output') {
    return '<div class="ins-section"><div class="ins-label">正文</div><p>' + inlineCode(s.text) + '</p></div>' +
      (s.thinking ? '<div class="ins-section"><div class="ins-label">思考</div><pre>' + esc(s.thinking) + '</pre></div>' : '') +
      '<div class="ins-actions"><button type="button" data-ins-action="copy-step">' + svg('copy') + '复制正文</button></div>'
  }
  if (tab === 'usage') {
    return '<dl class="ins-meta">' +
      metaRow('input tokens', fmtTok(s.inTok)) +
      metaRow('output tokens', fmtTok(s.outTok)) +
      metaRow('合计', fmtTok(s.inTok + s.outTok)) +
      metaRow('cache read', '—') +
      metaRow('成本', '$0.0' + (Math.random() * 6 + 2).toFixed(2)) +
    '</dl>' +
    '<div class="ins-section"><div class="ins-label">说明</div><p style="font-size:11.5px;color:var(--muted-foreground)">' +
      'Usage 取自该 assistant 消息的 <code>usage</code> 字段；进行中的请求不计入，避免出现「半次请求」的用量。</p></div>'
  }
  return '<div class="ins-section"><div class="ins-label">原始 message</div><pre>' +
    esc(JSON.stringify({ role: 'assistant', model: s.model, timestamp: s.at, content: s.text, usage: { input: s.inTok, output: s.outTok } }, null, 2)) +
  '</pre></div>'
}
function userInspector(rec, tab) {
  if (tab === 'summary') {
    return '<dl class="ins-meta">' + metaRow('时间', fmtClock(rec.at)) + metaRow('类型', 'USER') +
      metaRow('所在轮次', 'Turn ' + renderTurnBadge(rec.turnIndex)) + '</dl>' +
      '<div class="ins-section"><div class="ins-label">内容</div><p>' + inlineCode(rec.text) + '</p></div>'
  }
  return '<div class="ins-section"><div class="ins-label">原始 message</div><pre>' +
    esc(JSON.stringify({ role: 'user', timestamp: rec.at, content: rec.text }, null, 2)) + '</pre></div>'
}
function renderTurnBadge(i) { return String(i) }
function compactInspector(rec) {
  return '<dl class="ins-meta">' +
    metaRow('类型', '上下文压缩') +
    metaRow('耗时', fmtDur(rec.compact.durationMs)) +
    metaRow('时刻', fmtClock(rec.at)) +
    metaRow('位置', 'Between turns') +
  '</dl>' +
  '<div class="ins-section"><div class="ins-label">摘要</div><p>' + esc(rec.compact.note) + '</p></div>' +
  '<div class="ins-section"><div class="ins-label">说明</div><p style="font-size:11.5px;color:var(--muted-foreground)">' +
    '压缩本身也是一次模型请求，计入请求编号与累计 usage；被压缩的原始消息不删除，只是不再进入后续上下文。</p></div>'
}

/* ============================ 交互绑定 ============================ */
function setView(view) {
  state.view = view
  document.getElementById('tabChat').classList.toggle('on', view === 'chat')
  document.getElementById('tabTrace').classList.toggle('on', view === 'trace')
  document.getElementById('tabChat').setAttribute('aria-selected', String(view === 'chat'))
  document.getElementById('tabTrace').setAttribute('aria-selected', String(view === 'trace'))
  document.getElementById('chatView').classList.toggle('on', view === 'chat')
  document.getElementById('traceView').classList.toggle('on', view === 'trace')
  if (view === 'trace') {
    requestAnimationFrame(() => {
      const model = buildModel()
      renderTimeline(model)
    })
  }
}

function renderAll() {
  const model = buildModel()
  renderChat(model)
  renderLedger(model)
  renderTimeline(model)
  if (state.selected) {
    const rec = findRecord(model, state.selected)
    if (rec) renderInspector(rec)
  }
  updateResetButton()
}

function init() {
  /* 视图切换 */
  document.getElementById('tabChat').addEventListener('click', () => setView('chat'))
  document.getElementById('tabTrace').addEventListener('click', () => setView('trace'))

  /* 模式 */
  document.getElementById('modeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-mode]')
    if (!btn) return
    state.mode = btn.dataset.mode
    document.querySelectorAll('#modeSeg button').forEach((b) => b.classList.toggle('on', b === btn))
    renderTimeline(buildModel())
  })

  /* 展开/收起全部 */
  document.getElementById('expandAllBtn').addEventListener('click', (e) => {
    state.allExpanded = !state.allExpanded
    state.collapsedTurns.clear()
    state.collapsedSteps.clear()
    if (!state.allExpanded) {
      for (const t of buildModel().turns) {
        state.collapsedTurns.add(t.index)
        for (const s of t.steps) state.collapsedSteps.add(s.id)
      }
    }
    e.currentTarget.innerHTML = state.allExpanded
      ? svg('collapse') + '收起全部'
      : svg('expand') + '展开全部'
    renderLedger(buildModel())
  })

  /* 搜索 */
  document.getElementById('traceSearch').addEventListener('input', (e) => {
    state.query = e.target.value
    renderLedger(buildModel())
  })

  /* 清除区间筛选 */
  document.getElementById('tlReset').addEventListener('click', clearSelection)

  /* Ledger 事件委托 */
  const ledger = document.getElementById('ledger')
  ledger.addEventListener('click', (e) => {
    const turnBtn = e.target.closest('[data-turn]')
    if (turnBtn) {
      const key = turnBtn.dataset.turn
      const idx = key === 'between' ? 'between' : Number(key)
      if (state.collapsedTurns.has(idx)) state.collapsedTurns.delete(idx)
      else state.collapsedTurns.add(idx)
      renderLedger(buildModel())
      return
    }
    const stepBtn = e.target.closest('[data-step]')
    if (stepBtn) {
      const id = stepBtn.dataset.step
      if (state.collapsedSteps.has(id)) state.collapsedSteps.delete(id)
      else state.collapsedSteps.add(id)
      renderLedger(buildModel())
      return
    }
    const row = e.target.closest('[data-rec]')
    if (row) {
      const model = buildModel()
      const rec = findRecord(model, row.dataset.rec)
      if (rec && rec.kind === 'step') {
        // 选中 ASSISTANT 行时顺带展开其工具行（避免"选中了却看不到子项"）
        state.collapsedSteps.delete(rec.step.id)
        renderLedger(model)
      }
      selectRecord(row.dataset.rec, model)
      return
    }
    if (e.target.closest('#loadEarlier')) {
      const btn = e.target.closest('#loadEarlier')
      btn.textContent = '已加载全部本地记录'
      btn.disabled = true
      return
    }
  })

  /* Inspector */
  document.getElementById('insTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tab]')
    if (!btn) return
    state.tab = btn.dataset.tab
    const rec = findRecord(buildModel(), state.selected)
    if (rec) renderInspector(rec)
  })
  document.getElementById('insClose').addEventListener('click', () => {
    state.selected = null
    document.getElementById('inspector').classList.add('hidden')
    renderLedger(buildModel())
    renderTimeline(buildModel())
  })
  document.getElementById('insBody').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-ins-action]')
    if (!btn) return
    const rec = findRecord(buildModel(), state.selected)
    if (!rec) return
    const action = btn.dataset.insAction
    let text = ''
    if (action === 'copy-id') text = rec.id
    if (action === 'copy-args') text = rec.tool ? rec.tool.input : ''
    if (action === 'copy-result') text = rec.tool ? rec.tool.output : ''
    if (action === 'copy-step') text = rec.step ? rec.step.text : ''
    if (action === 'goto-chat') {
      setView('chat')
      requestAnimationFrame(() => {
        const card = document.querySelector('[data-jump="' + rec.id + '"]')
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' })
      })
      return
    }
    if (text && navigator.clipboard) {
      navigator.clipboard.writeText(text).catch(() => {})
      btn.style.color = 'var(--workflow-done)'
      setTimeout(() => { btn.style.color = '' }, 900)
    }
  })

  /* 对话区：点「在轨迹中查看」 */
  document.getElementById('chatInner').addEventListener('click', (e) => {
    const card = e.target.closest('[data-jump]')
    if (!card) return
    const id = card.dataset.jump
    setView('trace')
    requestAnimationFrame(() => {
      const model = buildModel()
      selectRecord(id, model, { scrollLedger: true })
    })
  })

  /* 演示状态 */
  document.getElementById('demoRow').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-mode]')
    if (!btn) return
    state.demo = btn.dataset.mode
    state.selected = null
    state.selection = null
    state.collapsedTurns.clear()
    state.collapsedSteps.clear()
    document.querySelectorAll('#demoRow .demo-btn').forEach((b) => b.classList.toggle('on', b === btn))
    document.getElementById('inspector').classList.add('hidden')
    renderAll()
  })

  initTimeline()
  renderAll()
  setView('trace')
}

/* 运行中：只更新时长文本与运行中条形，不重建列表（不打断 hover / 选中） */
function tickLive() {
  if (state.demo !== 'running') return
  const model = buildModel()
  const recs = flatRecords(model)
  const runningTool = recs.find((r) => r.kind === 'tool' && r.tool.status === 'running')
  if (!runningTool) return
  const dur = toolElapsed(runningTool.tool)
  const row = document.querySelector('[data-rec="' + runningTool.id + '"] .dur')
  if (row) row.textContent = '+' + fmtDur(dur)
  const chatDur = document.querySelector('[data-jump="' + runningTool.id + '"] .dur')
  if (chatDur) chatDur.textContent = '+' + fmtDur(dur)
  const bar = document.querySelector('.tl-bar[data-id="' + runningTool.id + '"]')
  if (bar && state.mode === 'time') {
    const bounds = computeBounds(model)
    if (bounds) {
      const w = Math.max(((runningTool.endAt - runningTool.at) / bounds.span) * 100, 0.9)
      bar.style.width = w + '%'
    }
  }
  if (state.selected === runningTool.id) {
    const rec = findRecord(model, runningTool.id)
    if (rec) renderInspector(rec)
  }
}

let booted = false
function boot() {
  if (booted) return
  booted = true
  init()
}
document.addEventListener('DOMContentLoaded', boot)
if (document.readyState !== 'loading') boot()
setInterval(tickLive, 160)
</script>
</body>
</html>
